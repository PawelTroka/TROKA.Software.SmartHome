front_door_left_open:
  name: "Error: Front door left open"
  message: Front door has been left open
  done_message: >-
    {% if is_state('binary_sensor.hallway_door', 'off') %}
      Front door is closed.
    {% else %}
      The front-door contact became unavailable; closure cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.hallway_door
  state: 'on'
  repeat: 2
  can_acknowledge: true
  skip_first: true
  notifiers:
    - level_important

front_door_left_unlocked:
  name: "Error: Front door lock is not confirmed"
  message: >-
    The front door has not reported locked for two minutes. Current lock state:
    {{ states('lock.smart_lock_ultra') }}.
  done_message: >-
    {% if is_state('lock.smart_lock_ultra', 'locked') %}
      Front door is locked.
    {% else %}
      The smart-lock state became unavailable; locking cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.front_door_lock_not_confirmed_locked
  state: 'on'
  repeat: 2
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

front_door_lock_monitoring_unavailable:
  name: "Error: Front door lock monitoring unavailable"
  message: >-
    The smart lock has been unavailable for five minutes. Locking cannot be
    confirmed; check the door manually.
  done_message: The smart lock is reporting again.
  entity_id: binary_sensor.front_door_lock_monitoring_unavailable
  state: 'on'
  repeat:
    - 15
    - 60
    - 360
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

flood_in_kitchen:
  name: "Error: Flood in kitchen"
  message:  "Flood in kitchen!!! There is a flood in kitchen. Flood in kitchen!!!"
  done_message: >-
    {% if is_state('binary_sensor.kitchen_flood_sensor', 'off') %}
      The kitchen flood sensor reports dry.
    {% else %}
      The kitchen flood sensor became unavailable; a dry state cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.kitchen_flood_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

flood_in_bathroom:
  name: "Error: Flood in bathroom"
  message:  "Flood in bathroom!!! There is a flood in bathroom. Flood in bathroom!!!"
  done_message: >-
    {% if is_state('binary_sensor.bathroom_water_leak_sensor', 'off') %}
      There is no longer a flood in the bathroom.
    {% else %}
      The bathroom leak sensor became unavailable while reporting a flood.
      The flood state cannot be confirmed; check the bathroom manually.
    {% endif %}
  entity_id: binary_sensor.bathroom_water_leak_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

flood_in_toilet:
  name: "Error: Flood in toilet"
  message:  "Flood in toilet!!! There is a flood in toilet. Flood in toilet!!!"
  done_message: >-
    {% if is_state('binary_sensor.toilet_flood_sensor', 'off') %}
      The toilet flood sensor reports dry.
    {% else %}
      The toilet flood sensor became unavailable; a dry state cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.toilet_flood_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

power_outage:
  name: "Error: power outage!"
  message:  "Power outage happened {{ states('sensor.ups_line_outage_time') | multiply(0.016666666666667) | float(1) }} minutes ago!"
  done_message: >-
    {% if has_value('sensor.ups_input_voltage') %}
      Power outage just ended.
    {% else %}
      UPS input telemetry became unavailable; mains power cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.ups_power_outage
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

ups_telemetry_unavailable:
  name: "Error: UPS input telemetry unavailable"
  message: >-
    UPS input-voltage telemetry has been unavailable for 5 minutes.
    Mains-power outage detection cannot operate until it returns.
  done_message: UPS input-voltage telemetry is available again.
  entity_id: binary_sensor.ups_telemetry_unavailable
  state: 'on'
  repeat:
    - 10
    - 60
    - 360
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important



radon_longterm_level_warning:
  name: "Radon level long term warning"
  message: >-
    Long-term radon is {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3,
    above the recommended residential reference level. Ventilate and keep monitoring.
  done_message: >-
    {% if has_value('sensor.airthings_radon_longterm_avg') %}
      Long-term radon warning ended at {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3;
      it may have returned safe or escalated to the dangerous tier.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_longterm_warning
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info


radon_longterm_level_dangerous:
  name: "Radon level long term high"
  message: >-
    Long-term radon is {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3.
    Ventilate, confirm the reading, and arrange professional radon mitigation.
  done_message: >-
    {% if has_value('sensor.airthings_radon_longterm_avg') %}
      Long-term radon fell to {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_longterm_dangerous
  state: 'on'
  repeat:
    - 5
    - 30
    - 120
    - 720
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

radon_1day_level_warning:
  name: "Radon level today warning"
  message: >-
    Daily radon is {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3,
    above the recommended residential reference level. Ventilate and keep monitoring.
  done_message: >-
    {% if has_value('sensor.airthings_radon_1day_avg') %}
      Daily radon warning ended at {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3;
      it may have returned safe or escalated to the dangerous tier.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_1day_warning
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info


radon_1day_level_dangerous:
  name: "Radon level today high"
  message: >-
    Daily radon is {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3.
    Ventilate and confirm the result with a reliable long-term measurement before arranging mitigation.
  done_message: >-
    {% if has_value('sensor.airthings_radon_1day_avg') %}
      Daily radon fell to {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_1day_dangerous
  state: 'on'
  repeat:
    - 5
    - 30
    - 120
    - 720
  can_acknowledge: true
  skip_first: false
  notifiers:
    - safety_silent

airthings_monitor_unavailable:
  name: "Error: Airthings monitor unavailable"
  message: >-
    Airthings radon or VOC telemetry has been unavailable for 5 minutes.
    Air-quality safety alerts cannot operate until the integration is restored.
  done_message: Airthings radon and VOC telemetry is available again.
  entity_id: binary_sensor.airthings_monitor_unavailable
  state: 'on'
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

bathroom_leak_sensor_unavailable:
  name: "Error: Bathroom leak sensor unavailable"
  message: >-
    The bathroom leak sensor has been unreachable or has not returned a valid
    state for at least 5 minutes.
    Bathroom leak protection is not currently reliable.
  done_message: The bathroom leak sensor is reporting again.
  entity_id: binary_sensor.bathroom_leak_sensor_unavailable
  state: 'on'
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

tado_heating_control_unavailable:
  name: "Error: Tado heating control unavailable"
  message: >-
    Tado heating data has been missing or stale for at least 15 minutes.
    Tado radiator commands may not take effect; floor heating and bedroom AC
    remain independently controlled.
  done_message: Tado heating data is current again.
  entity_id: binary_sensor.tado_heating_control_unavailable
  state: 'on'
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

co2_above_1000_ppm:
  name: CO2 above 1000 ppm
  title: >-
    {{ 'Elevated CO2 detected'
       if is_state('binary_sensor.co2_above_1000_ppm', 'on')
       else 'CO2 warning update' }}
  message: >-
    CO2 has been above 1000 ppm for 5 minutes.
    {{ state_attr('binary_sensor.co2_above_1000_ppm', 'readings') }}.
    Ventilate the affected room.
  done_message: >-
    {% if has_value('sensor.netatmo_indoor_co2')
          and has_value('sensor.netatmo_bedroom_co2')
          and has_value('sensor.netatmo_office_co2') %}
      CO2 readings have remained at or below 1000 ppm for 10 minutes.
    {% else %}
      CO2 telemetry became unavailable; recovery cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.co2_above_1000_ppm
  state: "on"
  repeat:
    - 30
    - 60
    - 120
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

co2_above_2000_ppm:
  name: CO2 above 2000 ppm
  title: >-
    {{ 'Serious CO2 ventilation warning'
       if is_state('binary_sensor.co2_above_2000_ppm', 'on')
       else 'Serious CO2 warning update' }}
  message: >-
    CO2 has remained above 2000 ppm for 10 minutes.
    {{ state_attr('binary_sensor.co2_above_2000_ppm', 'readings') }}.
    Open windows and doors, leave the affected room if you feel unwell, and
    verify that the sensor is positioned correctly.
  done_message: >-
    {% if has_value('sensor.netatmo_indoor_co2')
          and has_value('sensor.netatmo_bedroom_co2')
          and has_value('sensor.netatmo_office_co2') %}
      CO2 readings have remained at or below 2000 ppm for 10 minutes.
    {% else %}
      CO2 telemetry became unavailable; recovery cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.co2_above_2000_ppm
  state: "on"
  repeat:
    - 15
    - 30
    - 60
  can_acknowledge: true
  skip_first: false
  notifiers:
    - safety_silent

co2_monitoring_unavailable:
  name: "Error: CO2 monitoring unavailable"
  message: >-
    One or more expected Netatmo room CO2 readings have been unavailable for
    five minutes, so a high reading could otherwise disappear without warning.
  done_message: All expected Netatmo room CO2 readings are available again.
  entity_id: binary_sensor.co2_monitoring_unavailable
  state: "on"
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

front_door_contact_unavailable:
  name: "Error: Front door contact unavailable"
  message: >-
    The front-door contact has been unavailable for 5 minutes, so the
    door-left-open alert cannot operate until the sensor reports again.
  done_message: The front-door contact is reporting again.
  entity_id: binary_sensor.front_door_contact_unavailable
  state: "on"
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

cooktop_unattended:
  name: "Safety: Cooktop unattended"
  message: >-
    The cooktop reports active while both residents are away or shared night
    mode is active. Check it immediately; Home Assistant will not switch it off.
  done_message: >-
    {% if has_value('switch.cooktop_power')
          or has_value('sensor.cooktop_operation_state') %}
      The cooktop no longer appears unattended. It may have been switched off,
      a resident may be home, or shared night mode may have ended.
    {% else %}
      Cooktop telemetry became unavailable; a safe state cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.cooktop_unattended
  state: "on"
  repeat:
    - 2
    - 5
    - 15
  can_acknowledge: true
  skip_first: false
  notifiers:
    - safety_silent

cooktop_monitoring_unavailable:
  name: "Error: Cooktop monitoring unavailable"
  message: >-
    Cooktop power and operating-state telemetry have both been unavailable for
    5 minutes, so unattended-cooking detection cannot operate.
  done_message: Cooktop monitoring is available again.
  entity_id: binary_sensor.cooktop_monitoring_unavailable
  state: "on"
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info
