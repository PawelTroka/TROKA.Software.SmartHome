front_door_left_open:
  name: "Error: Front door left open"
  message: Front door has been left open
  done_message: Front door is finally closed
  entity_id: binary_sensor.hallway_door
  state: 'on'
  repeat: 2
  can_acknowledge: true
  skip_first: true
  notifiers:
    - level_important

front_door_left_unlocked:
  name: "Error: Front door left unlocked"
  message: Front door has been left unlocked.
  done_message: Front door is finally locked
  entity_id: lock.smart_lock_ultra
  state: 'unlocked'
  repeat: 2
  can_acknowledge: true
  skip_first: true
  notifiers:
    - level_important

flood_in_kitchen:
  name: "Error: Flood in kitchen"
  message:  "Flood in kitchen!!! There is a flood in kitchen. Flood in kitchen!!!"
  done_message: There is no longer flood in kitchen.
  entity_id: binary_sensor.kitchen_flood_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

flood_in_bathroom:
  name: "Error: Flood in bathroom"
  message:  "Flood in bathroom!!! There is a flood in bathroom. Flood in bathroom!!!"
  done_message: There is no longer flood in bathroom.
  entity_id: binary_sensor.bathroom_water_leak_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

flood_in_toilet:
  name: "Error: Flood in toilet"
  message:  "Flood in toilet!!! There is a flood in toilet. Flood in toilet!!!"
  done_message: There is no longer flood in toilet.
  entity_id: binary_sensor.toilet_flood_sensor
  state: 'on'
  repeat:
    - 1
    - 5
    - 15
    - 30
    - 60
  can_acknowledge: false
  skip_first: false
  notifiers:
    - safety_silent

power_outage:
  name: "Error: power outage!"
  message:  "Power outage happened {{ states('sensor.ups_line_outage_time') | multiply(0.016666666666667) | float(1) }} minutes ago!"
  done_message: >-
    {% if has_value('sensor.ups_input_voltage') %}
      Power outage just ended.
    {% else %}
      UPS input telemetry became unavailable; mains power cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.ups_power_outage
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

ups_low_power:
  name: "Error: low UPS remaining power!"
  message: >-
    UPS reports {{ states('sensor.ups_battery_capacity') }}% charge and
    {{ states('sensor.ups_remaining_backup_time') }} minute(s) of runtime.
    It cannot safely protect the home server during an outage.
  done_message: >-
    {% if has_value('sensor.ups_battery_capacity')
          and has_value('sensor.ups_remaining_backup_time') %}
      UPS battery capacity and runtime are no longer critical.
    {% else %}
      UPS battery telemetry became unavailable; recovery cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.ups_low_runtime
  state: 'on'
  repeat:
    - 2
    - 10
    - 30
    - 60
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

ups_telemetry_unavailable:
  name: "Error: UPS telemetry unavailable"
  message: >-
    UPS voltage, battery, or runtime telemetry has been unavailable for 5 minutes.
    Power protection cannot be monitored.
  done_message: UPS telemetry is available again.
  entity_id: binary_sensor.ups_telemetry_unavailable
  state: 'on'
  repeat:
    - 10
    - 60
    - 360
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important



radon_longterm_level_warning:
  name: "Radon level long term warning"
  message: >-
    Long-term radon is {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3,
    above the recommended residential reference level. Ventilate and keep monitoring.
  done_message: >-
    {% if has_value('sensor.airthings_radon_longterm_avg') %}
      Long-term radon warning ended at {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3;
      it may have returned safe or escalated to the dangerous tier.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_longterm_warning
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info


radon_longterm_level_dangerous:
  name: "Radon level long term high"
  message: >-
    Long-term radon is {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3.
    Ventilate, confirm the reading, and arrange professional radon mitigation.
  done_message: >-
    {% if has_value('sensor.airthings_radon_longterm_avg') %}
      Long-term radon fell to {{ states('sensor.airthings_radon_longterm_avg') }} Bq/m3.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_longterm_dangerous
  state: 'on'
  repeat:
    - 5
    - 30
    - 120
    - 720
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_important

radon_1day_level_warning:
  name: "Radon level today warning"
  message: >-
    Daily radon is {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3,
    above the recommended residential reference level. Ventilate and keep monitoring.
  done_message: >-
    {% if has_value('sensor.airthings_radon_1day_avg') %}
      Daily radon warning ended at {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3;
      it may have returned safe or escalated to the dangerous tier.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_1day_warning
  state: 'on'
  repeat: 5
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info


radon_1day_level_dangerous:
  name: "Radon level today high"
  message: >-
    Daily radon is {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3.
    Ventilate and confirm the result with a reliable long-term measurement before arranging mitigation.
  done_message: >-
    {% if has_value('sensor.airthings_radon_1day_avg') %}
      Daily radon fell to {{ states('sensor.airthings_radon_1day_avg') }} Bq/m3.
    {% else %}
      The Airthings radon reading became unavailable; safety cannot be confirmed.
    {% endif %}
  entity_id: binary_sensor.radon_1day_dangerous
  state: 'on'
  repeat:
    - 5
    - 30
    - 120
    - 720
  can_acknowledge: true
  skip_first: false
  notifiers:
    - safety_silent

airthings_monitor_unavailable:
  name: "Error: Airthings monitor unavailable"
  message: >-
    Airthings radon or VOC telemetry has been unavailable for 5 minutes.
    Air-quality safety alerts cannot operate until the integration is restored.
  done_message: Airthings radon and VOC telemetry is available again.
  entity_id: binary_sensor.airthings_monitor_unavailable
  state: 'on'
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

bathroom_leak_sensor_unavailable:
  name: "Error: Bathroom leak sensor unavailable"
  message: >-
    The bathroom leak sensor has not reported for more than 6 hours.
    Bathroom leak protection is not currently reliable.
  done_message: The bathroom leak sensor is reporting again.
  entity_id: binary_sensor.bathroom_leak_sensor_unavailable
  state: 'on'
  repeat:
    - 60
    - 360
    - 1440
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info

co2_above_1000_ppm:
  name: CO2 above 1000 ppm
  title: High CO2 detected
  message: >-
    CO2 has been above 1000 ppm for 5 minutes.
    {{ state_attr('binary_sensor.co2_above_1000_ppm', 'readings') }}.
    Ventilate the affected room.
  done_message: >-
    CO2 readings have remained at or below 1000 ppm for 10 minutes.
  entity_id: binary_sensor.co2_above_1000_ppm
  state: "on"
  repeat:
    - 30
    - 60
    - 120
  can_acknowledge: true
  skip_first: false
  notifiers:
    - level_info
