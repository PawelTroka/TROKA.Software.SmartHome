- switch:
    - name: Watch a movie
      default_entity_id: switch.watch_movie
      unique_id: watch_movie
      state: "{{ is_state_attr('media_player.shield_android_tv', 'source', 'Plex') }}"
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.watch_a_movie
      turn_off:
        - action: script.turn_on
          target:
            entity_id: script.turn_off_video_media_living_room
      icon: >-
        {% if is_state_attr('media_player.shield_android_tv', 'source', 'Plex') %}
          mdi:filmstrip
        {% else %}
          mdi:filmstrip-off
        {% endif %}

    - name: Watch YouTube
      default_entity_id: switch.watch_youtube
      unique_id: watch_youtube
      state: "{{ is_state_attr('media_player.shield_android_tv', 'source', 'com.teamsmart.videomanager.tv') }}"
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.watch_youtube
      turn_off:
        - action: script.turn_on
          target:
            entity_id: script.turn_off_video_media_living_room
      icon: mdi:youtube-tv

    - name: Play a game
      default_entity_id: switch.play_game
      unique_id: play_game
      state: >-
        {{ is_state_attr('remote.harmonyhub', 'current_activity', 'Play a Game')
           and not is_state_attr('media_player.xboxone', 'media_title', 'Netflix') }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.play_a_game
      turn_off:
        - action: script.turn_on
          target:
            entity_id: script.turn_off_video_media_living_room
      icon: >-
        {% if is_state_attr('remote.harmonyhub', 'current_activity', 'Play a Game') %}
          mdi:microsoft-xbox-controller
        {% else %}
          mdi:microsoft-xbox-controller-off
        {% endif %}

    - name: Watch Netflix
      default_entity_id: switch.watch_netflix
      unique_id: watch_netflix
      state: "{{ is_state_attr('media_player.xboxone', 'media_title', 'Netflix') }}"
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.watch_netflix
      turn_off:
        - action: script.turn_on
          target:
            entity_id: script.turn_off_video_media_living_room
      icon: mdi:netflix

    - name: Dolby Atmos Music
      default_entity_id: switch.dolby_atmos_music
      unique_id: dolby_atmos_music
      state: "{{ is_state_attr('media_player.shield_android_tv', 'source', 'com.aspiro.tidal') }}"
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.dolby_atmos_music
      turn_off:
        - action: script.turn_on
          target:
            entity_id: script.turn_off_video_media_living_room
      icon: mdi:dolby

    - name: Shower music
      default_entity_id: switch.shower_music
      unique_id: shower_music
      state: >-
        {{ is_state('media_player.bathroom', 'playing')
           and (state_attr('media_player.bathroom', 'group_members') | default([], true) | count < 2) }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.shower_music
      turn_off:
        - action: media_player.media_pause
          target:
            entity_id: media_player.bathroom
      icon: mdi:shower-head

    - name: Party music
      default_entity_id: switch.party_music
      unique_id: party_music
      state: >-
        {{ is_state('media_player.living_room', 'playing')
           and (state_attr('media_player.living_room', 'group_members') | default([], true) | count > 2)
           and (state_attr('media_player.denon_avc_x6500h_avr', 'volume_level') | float(0) > 0.50) }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.party_music
      turn_off:
        - action: media_player.media_pause
          target:
            entity_id: media_player.living_room
        - action: script.turn_on
          target:
            entity_id: script.turn_off_denon_receiver
      icon: mdi:party-popper

    - name: Ambient music
      default_entity_id: switch.ambient_music
      unique_id: ambient_music
      state: >-
        {{ is_state('media_player.bathroom', 'playing')
           and (state_attr('media_player.bathroom', 'group_members') | default([], true) | count > 2)
           and (state_attr('media_player.office', 'group_members') | default([], true) | count > 2)
           and (state_attr('media_player.living_room', 'group_members') | default([], true) | count < 2) }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.ambient_music
      turn_off:
        - action: media_player.media_pause
          target:
            entity_id: media_player.bathroom
      icon: mdi:music-note-bluetooth

    - name: Work music
      default_entity_id: switch.work_music
      unique_id: work_music
      state: >-
        {{ is_state('media_player.bathroom', 'playing')
           and (state_attr('media_player.bathroom', 'group_members') | default([], true) | count > 2)
           and (state_attr('media_player.office', 'group_members') | default([], true) | count < 2) }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.work_music
      turn_off:
        - action: media_player.media_pause
          target:
            entity_id: media_player.bathroom
      icon: mdi:briefcase

    - name: Ambient living room music
      default_entity_id: switch.ambient_living_room_music
      unique_id: ambient_living_room_music
      state: >-
        {{ is_state('media_player.living_room', 'playing')
           and (state_attr('media_player.living_room', 'group_members') | default([], true) | count > 2)
           and (state_attr('media_player.denon_avc_x6500h_avr', 'volume_level') | float(0) < 0.50) }}
      turn_on:
        - action: script.turn_on
          target:
            entity_id: script.ambient_living_room_music
      turn_off:
        - action: media_player.media_pause
          target:
            entity_id: media_player.living_room
        - action: script.turn_on
          target:
            entity_id: script.turn_off_denon_receiver
      icon: mdi:surround-sound

    - name: Heat living room
      default_entity_id: switch.heat_living_room
      unique_id: heat_living_room
      availability: "{{ has_value('climate.living_room') }}"
      state: "{{ is_state('climate.living_room', 'heat') }}"
      turn_on:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.living_room
          data:
            hvac_mode: heat
      turn_off:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.living_room
          data:
            hvac_mode: "off"
      icon: "{{ 'mdi:radiator' if is_state('climate.living_room', 'heat') else 'mdi:radiator-off' }}"

