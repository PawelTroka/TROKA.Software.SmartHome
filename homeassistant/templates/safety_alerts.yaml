- binary_sensor:
    - name: UPS power outage
      default_entity_id: binary_sensor.ups_power_outage
      unique_id: ups_power_outage
      device_class: problem
      availability: "{{ has_value('sensor.ups_input_voltage') }}"
      state: >-
        {{ states('sensor.ups_input_voltage') | float(230) < 200 }}
      delay_on: "00:00:05"
      delay_off: "00:00:30"

    - name: UPS telemetry unavailable
      default_entity_id: binary_sensor.ups_telemetry_unavailable
      unique_id: ups_telemetry_unavailable
      device_class: problem
      state: >-
        {{ not has_value('sensor.ups_input_voltage') }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"

    # Battery/runtime alerting is intentionally disabled while the UPS is
    # operated without a battery. Input-voltage monitoring remains active.

    - name: Radon longterm warning
      default_entity_id: binary_sensor.radon_longterm_warning
      unique_id: radon_longterm_warning
      device_class: problem
      availability: "{{ has_value('sensor.airthings_radon_longterm_avg') }}"
      state: >-
        {% set radon = states('sensor.airthings_radon_longterm_avg') | float(0) %}
        {{ radon > 100 and radon <= 150 }}
      delay_on: "00:05:00"

    - name: Radon longterm dangerous
      default_entity_id: binary_sensor.radon_longterm_dangerous
      unique_id: radon_longterm_dangerous
      device_class: safety
      availability: "{{ has_value('sensor.airthings_radon_longterm_avg') }}"
      state: >-
        {{ states('sensor.airthings_radon_longterm_avg') | float(0) > 150 }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"

    - name: Radon 1day warning
      default_entity_id: binary_sensor.radon_1day_warning
      unique_id: radon_1day_warning
      device_class: problem
      availability: "{{ has_value('sensor.airthings_radon_1day_avg') }}"
      state: >-
        {% set radon = states('sensor.airthings_radon_1day_avg') | float(0) %}
        {{ radon > 100 and radon <= 150 }}
      delay_on: "00:05:00"

    - name: Radon 1day dangerous
      default_entity_id: binary_sensor.radon_1day_dangerous
      unique_id: radon_1day_dangerous
      device_class: safety
      availability: "{{ has_value('sensor.airthings_radon_1day_avg') }}"
      state: >-
        {{ states('sensor.airthings_radon_1day_avg') | float(0) > 150 }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"

    - name: Airthings monitor unavailable
      default_entity_id: binary_sensor.airthings_monitor_unavailable
      unique_id: airthings_monitor_unavailable
      device_class: problem
      state: >-
        {{ not (has_value('sensor.airthings_radon_longterm_avg')
                and has_value('sensor.airthings_radon_1day_avg')
                and has_value('sensor.airthings_voc')) }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"

    - name: Bathroom leak sensor unavailable
      default_entity_id: binary_sensor.bathroom_leak_sensor_unavailable
      unique_id: bathroom_leak_sensor_unavailable
      device_class: problem
      state: >-
        {% set leak_entity = 'binary_sensor.bathroom_water_leak_sensor' %}
        {% set leak_missing = states(leak_entity) == 'unknown' %}
        {% set leak_sensor = states.binary_sensor.bathroom_water_leak_sensor %}
        {{ leak_missing
           or (not has_value(leak_entity)
               and now() - leak_sensor.last_changed >= timedelta(minutes=5))
           or leak_sensor.last_reported is none
           or now() - leak_sensor.last_reported > timedelta(hours=6) }}
      delay_off: "00:05:00"

    - name: Tado heating control unavailable
      default_entity_id: binary_sensor.tado_heating_control_unavailable
      unique_id: tado_heating_control_unavailable
      device_class: problem
      state: >-
        {% set tado_entities = [
             'climate.bathroom',
             'climate.bedroom',
             'climate.office',
             'climate.kitchen',
             'climate.living_room'
           ] %}
        {% set ns = namespace(problem=false) %}
        {% for entity_id in tado_entities %}
          {% set entity = states[entity_id] %}
          {% if entity is none
                or not has_value(entity_id)
                or entity.last_reported is none
                or now() - entity.last_reported > timedelta(minutes=15) %}
            {% set ns.problem = true %}
          {% endif %}
        {% endfor %}
        {{ ns.problem }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"
