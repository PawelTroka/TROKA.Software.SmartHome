- binary_sensor:
    - name: CO2 above 1000 ppm
      default_entity_id: binary_sensor.co2_above_1000_ppm
      unique_id: co2_above_1000_ppm
      device_class: problem
      availability: >-
        {{ has_value('sensor.netatmo_indoor_co2')
           or has_value('sensor.netatmo_bedroom_co2')
           or has_value('sensor.netatmo_office_co2')
           or has_value('sensor.airthings_co2') }}
      state: >-
        {{ [
             states('sensor.netatmo_indoor_co2') | float(0),
             states('sensor.netatmo_bedroom_co2') | float(0),
             states('sensor.netatmo_office_co2') | float(0),
             states('sensor.airthings_co2') | float(0)
           ] | max > 1000 }}
      delay_on: "00:05:00"
      delay_off: "00:10:00"
      attributes:
        readings: >-
          Indoor {{ states('sensor.netatmo_indoor_co2') }} ppm;
          Bedroom {{ states('sensor.netatmo_bedroom_co2') }} ppm;
          Office {{ states('sensor.netatmo_office_co2') }} ppm;
          Airthings {{ states('sensor.airthings_co2') }} ppm

    - name: CO2 monitoring unavailable
      default_entity_id: binary_sensor.co2_monitoring_unavailable
      unique_id: co2_monitoring_unavailable
      device_class: problem
      state: >-
        {{ not has_value('sensor.netatmo_indoor_co2')
           or not has_value('sensor.netatmo_bedroom_co2')
           or not has_value('sensor.netatmo_office_co2') }}
      delay_on: "00:05:00"
      delay_off: "00:05:00"

    - name: CO2 above 2000 ppm
      default_entity_id: binary_sensor.co2_above_2000_ppm
      unique_id: co2_above_2000_ppm
      device_class: safety
      availability: >-
        {{ has_value('sensor.netatmo_indoor_co2')
           or has_value('sensor.netatmo_bedroom_co2')
           or has_value('sensor.netatmo_office_co2')
           or has_value('sensor.airthings_co2') }}
      state: >-
        {{ [
             states('sensor.netatmo_indoor_co2') | float(0),
             states('sensor.netatmo_bedroom_co2') | float(0),
             states('sensor.netatmo_office_co2') | float(0),
             states('sensor.airthings_co2') | float(0)
           ] | max > 2000 }}
      delay_on: "00:10:00"
      delay_off: "00:10:00"
      attributes:
        readings: >-
          Indoor {{ states('sensor.netatmo_indoor_co2') }} ppm;
          Bedroom {{ states('sensor.netatmo_bedroom_co2') }} ppm;
          Office {{ states('sensor.netatmo_office_co2') }} ppm;
          Airthings {{ states('sensor.airthings_co2') }} ppm
