- sensor:
    - name: USG CPU percentage
      default_entity_id: sensor.unifi_gateway_wan_cpu
      unique_id: unifi_gateway_wan_cpu
      unit_of_measurement: percentage
      availability: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats') %}
        {{ stats is mapping and is_number(stats.get('cpu')) }}
      state: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats')
           | default({}, true) %}
        {{ stats.get('cpu') | float(0) }}

    - name: USG Memory percentage
      default_entity_id: sensor.unifi_gateway_wan_mem
      unique_id: unifi_gateway_wan_mem
      unit_of_measurement: percentage
      availability: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats') %}
        {{ stats is mapping and is_number(stats.get('mem')) }}
      state: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats')
           | default({}, true) %}
        {{ stats.get('mem') | float(0) }}

    - name: USG CPU temperature
      default_entity_id: sensor.unifi_gateway_wan_cpu_temp
      unique_id: unifi_gateway_wan_cpu_temp
      unit_of_measurement: degrees
      availability: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats') %}
        {% set temps = stats.get('temps', {}) if stats is mapping else {} %}
        {{ is_number(temps.get('CPU', '') | replace('C', '') | trim) }}
      state: >-
        {% set stats = state_attr('sensor.unifi_gateway_wan', 'gw_system-stats')
           | default({}, true) %}
        {{ stats.get('temps', {}).get('CPU', '')
           | replace('C', '') | trim | float(0) }}

    - name: USG Speedtest Download
      default_entity_id: sensor.unifi_gateway_www_xput_down
      unique_id: unifi_gateway_www_xput_down
      unit_of_measurement: Mbps
      icon: mdi:speedometer
      availability: "{{ is_number(state_attr('sensor.unifi_gateway_www', 'xput_down')) }}"
      state: "{{ state_attr('sensor.unifi_gateway_www', 'xput_down') | float(0) }}"

    - name: USG Speedtest Upload
      default_entity_id: sensor.unifi_gateway_www_xput_up
      unique_id: unifi_gateway_www_xput_up
      unit_of_measurement: Mbps
      icon: mdi:speedometer
      availability: "{{ is_number(state_attr('sensor.unifi_gateway_www', 'xput_up')) }}"
      state: "{{ state_attr('sensor.unifi_gateway_www', 'xput_up') | float(0) }}"

    - name: USG Speedtest Ping
      default_entity_id: sensor.unifi_gateway_www_speedtest_ping
      unique_id: unifi_gateway_www_speedtest_ping
      unit_of_measurement: ms
      availability: "{{ is_number(state_attr('sensor.unifi_gateway_www', 'speedtest_ping')) }}"
      state: "{{ state_attr('sensor.unifi_gateway_www', 'speedtest_ping') | float(0) }}"

    - name: WAN Download
      default_entity_id: sensor.unifi_gateway_wan_download
      unique_id: unifi_gateway_wan_download
      unit_of_measurement: Kbps
      availability: "{{ is_number(state_attr('sensor.unifi_gateway_wan', 'rx_bytes-r')) }}"
      state: >-
        {{ ((state_attr('sensor.unifi_gateway_wan', 'rx_bytes-r')
             | float(0)) / 1024) | int }}

    - name: Guests
      default_entity_id: sensor.unifi_gateway_wlan_num_guest
      unique_id: unifi_gateway_wlan_num_guest
      availability: "{{ is_number(state_attr('sensor.unifi_gateway_wlan', 'num_guest')) }}"
      state: "{{ state_attr('sensor.unifi_gateway_wlan', 'num_guest') | int(0) }}"

    - name: Harmony Hub activity
      default_entity_id: sensor.harmony_hub_activity
      unique_id: harmony_hub_activity
      availability: "{{ state_attr('remote.harmonyhub', 'current_activity') is not none }}"
      state: "{{ state_attr('remote.harmonyhub', 'current_activity') }}"
