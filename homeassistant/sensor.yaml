- platform: unifigateway
  host: localhost
  username: !secret unifi_username
  password: !secret unifi_password
- platform: airthings_wave
  scan_interval: 600
  mac: C4:64:E3:ED:18:38 # replace with MAC of your Airthings Wave+
- platform: hddtemp
  name: /dev/sda
  port: 11231
- platform: hddtemp
  name: /dev/sdb
  port: 11232
- platform: hddtemp
  name: /dev/sdc
  port: 11233
- platform: hddtemp
  name: /dev/sdd
  port: 11234
- platform: hddtemp
  name: /dev/sde
  port: 11235
- platform: hddtemp
  name: /dev/sdf
  port: 11236
- platform: hddtemp
  name: /dev/sdg
  port: 11237
- platform: hddtemp
  name: /dev/sdh
  port: 11238
- platform: hddtemp
  name: /dev/sdi
  port: 11239
- platform: snmp
  name: 'UPS temperature'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.2.7.0
  value_template: '{{value | float}}'
  unit_of_measurement: '°C'
- platform: snmp
  name: 'UPS input voltage'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.5.3.1.2.1 #iso.3.6.1.2.1.33.1.3.3.1.3.1
  value_template: '{{value | float}}'
  unit_of_measurement: 'V'
- platform: snmp
  name: 'UPS input frequency'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.5.1.0 #iso.3.6.1.2.1.33.1.3.3.1.2.1
  value_template: '{{((value | int) / 10) | float}}'
  unit_of_measurement: 'Hz'
- platform: snmp
  name: 'UPS ouput voltage'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.4.4.1.2.1
  value_template: '{{value | float}}'
  unit_of_measurement: 'V'
- platform: snmp
  name: 'UPS output frequency'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.4.2.0
  value_template: '{{((value | int) / 10) | float}}'
  unit_of_measurement: 'Hz'
- platform: snmp
  name: 'UPS load'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.4.4.1.4.1
  unit_of_measurement: 'W'
  value_template: '{{value | float}}'
- platform: snmp
  name: 'UPS load percentage'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.4.4.1.5.1
  unit_of_measurement: '%'
  value_template: '{{value | float}}'
- platform: snmp
  name: 'UPS battery voltage'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.2.5.0
  value_template: '{{((value | int) / 10) | float}}'
  unit_of_measurement: 'V'
- platform: snmp
  name: 'UPS line outage time'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.2.2.0
  unit_of_measurement: 'seconds'
  value_template: '{{value | float}}'
- platform: snmp
  name: 'UPS remaining backup time'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.2.3.0
  unit_of_measurement: 'minutes'
  value_template: '{{value | float}}'
- platform: snmp
  name: 'UPS battery capacity'
  host: 10.10.10.90
  baseoid: iso.3.6.1.2.1.33.1.2.4.0
  unit_of_measurement: '%'
  value_template: '{{value | float}}'



- platform: time_date
  display_options:
    - 'time'
    - 'date'
    - 'date_time'
    - 'date_time_iso'
    - 'time_date'
    - 'time_utc'
    - 'beat'

