# Kitchen lights defaults

set_kitchen_lights_to_default:
  mode: queued
  max: 10
  sequence:
  - action: lifx.effect_stop
    target:
      entity_id:
        - light.kitchen_cabinet_strip
        - light.kitchen_island_strip
    continue_on_error: true
  - parallel:
      - action: script.set_kitchen_countertop_lights_to_default
      - action: script.set_kitchen_island_lights_to_default
      - action: script.set_kitchen_cabinet_strip_to_default
      - action: script.set_kitchen_island_strip_to_default
  - delay: "00:00:01"
  - action: script.normalize_kitchen_lifx_strips
  - if:
      - condition: state
        entity_id: input_boolean.house_night_mode
        state: "off"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kitchen_night_lighting_reset_pending

set_kitchen_countertop_lights_to_default:
  sequence:
  - service: light.turn_on
    entity_id: light.kitchen_countertop_lights
    data:
      brightness_pct: 100
      color_temp_kelvin: 5500

set_kitchen_island_lights_to_default:
  sequence:
  - service: light.turn_on
    entity_id: light.kitchen_island_lights
    data:
      brightness_pct: 50
      color_temp_kelvin: 6500

set_kitchen_cabinet_strip_to_default:
  sequence:
  - service: light.turn_on
    entity_id: light.kitchen_cabinet_strip
    data:
      brightness: 168
      color_temp_kelvin: 8696

