front_door:
  alias: Front door
  sequence:
    - service: script.turn_on
      data_template:
        entity_id: >
          {% if is_state('lock.smart_lock_ultra', 'locked') %}
            script.unlock_front_door
          {% else %}
            script.lock_front_door
          {% endif %}

lock_front_door:
  sequence:
    - service: lock.lock
      entity_id: lock.smart_lock_ultra

unlock_front_door:
  sequence:
    - service: lock.unlock
      entity_id: lock.smart_lock_ultra
