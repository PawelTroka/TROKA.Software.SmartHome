set_tado_hvac_mode_best_effort:
  alias: Set a Tado zone without blocking the calling routine
  mode: parallel
  max: 20
  fields:
    climate_entity:
      name: Tado climate entity
      required: true
      selector:
        entity:
          domain: climate
    hvac_mode:
      name: HVAC mode
      required: true
      selector:
        select:
          options:
            - "off"
            - heat
  sequence:
    - condition: template
      value_template: >-
        {{ climate_entity in [
             'climate.bathroom',
             'climate.bedroom',
             'climate.office',
             'climate.kitchen',
             'climate.living_room'
           ]
           and hvac_mode in ['off', 'heat']
           and has_value(climate_entity)
           and not is_state(climate_entity, hvac_mode) }}
    - action: climate.set_hvac_mode
      target:
        entity_id: "{{ climate_entity }}"
      data:
        hvac_mode: "{{ hvac_mode }}"

turn_off_heating_everywhere:
  alias: Turn off heating without allowing one zone to block the others
  mode: queued
  max: 5
  sequence:
    - parallel:
        - action: climate.turn_off
          target:
            entity_id: climate.bathroom_floor
          continue_on_error: true
        - action: climate.turn_off
          target:
            entity_id: climate.kitchen_floor
          continue_on_error: true
        - action: climate.turn_off
          target:
            entity_id: climate.toilet_floor
          continue_on_error: true
    # PyTado currently raises uncaught API-shape errors. Start each zone as an
    # isolated child script so a Tado failure cannot abort its caller.
    - repeat:
        for_each:
          - climate.bathroom
          - climate.bedroom
          - climate.office
          - climate.kitchen
          - climate.living_room
        sequence:
          - action: script.turn_on
            target:
              entity_id: script.set_tado_hvac_mode_best_effort
            data:
              variables:
                climate_entity: "{{ repeat.item }}"
                hvac_mode: "off"

turn_on_heating_everywhere_except_bedroom_and_office:
  mode: queued
  max: 5
  sequence:
    - action: climate.turn_on
      target:
        entity_id: climate.bathroom_floor
      continue_on_error: true
    - action: climate.turn_on
      target:
        entity_id: climate.kitchen_floor
      continue_on_error: true
    - action: climate.turn_on
      target:
        entity_id: climate.toilet_floor
      continue_on_error: true
    - action: script.turn_on
      target:
        entity_id: script.set_tado_hvac_mode_best_effort
      data:
        variables:
          climate_entity: climate.living_room
          hvac_mode: heat
    - delay: '00:00:01'
    #- service: climate.set_hvac_mode
    #  target:
    #    entity_id: climate.office # office is used exclusively by Pawel
    #  data:
    #    hvac_mode: heat
    - delay: '00:00:02'
    - action: script.turn_on
      target:
        entity_id: script.set_tado_hvac_mode_best_effort
      data:
        variables:
          climate_entity: climate.bathroom
          hvac_mode: heat
    - delay: '00:00:03'
    - action: script.turn_on
      target:
        entity_id: script.set_tado_hvac_mode_best_effort
      data:
        variables:
          climate_entity: climate.kitchen
          hvac_mode: heat
    # it is desired to keep Bedroom cool, so it's commented out for now
    #- service: climate.set_hvac_mode
    #  target:
