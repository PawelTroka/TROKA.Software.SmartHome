# general

do_nothing:
  sequence: []

turn_off_everything:
  sequence:
    - service: switch.turn_off
      entity_id: switch.bathroom_mirror_switch_demister
      continue_on_error: true
    - service: light.turn_off
      entity_id: group.all_lights
      continue_on_error: true
    - service: climate.turn_off
      entity_id: group.all_climate
      continue_on_error: true
    - service: script.turn_on
      entity_id: script.turn_off_media_everywhere
      continue_on_error: true

turn_off_media_and_lights_everywhere_except_bedroom:
  sequence:
    - service: light.turn_off
      entity_id: group.all_lights_except_bedroom
      continue_on_error: true
    - service: script.turn_on
      entity_id: script.turn_off_media_everywhere_except_bedroom
      continue_on_error: true

turn_off_lights_and_tv_in_bedroom:
  sequence:
    - service: light.turn_off
      entity_id: light.bedroom_lights
      continue_on_error: true
    - service: script.turn_on
      entity_id: script.turn_off_bedroom_tv
      continue_on_error: true

turn_on_necessary_things:
  sequence:
    - service: script.turn_on
      entity_id: script.turn_on_heating_everywhere_except_bedroom_and_office

flash_all_lights:
  sequence:
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights

normalize_kitchen_lifx_strip:
  alias: Normalize a kitchen LIFX strip to one solid color
  mode: parallel
  max: 8
  fields:
    strip_entity:
      name: Kitchen strip
      description: Kitchen LIFX strip whose zones should be made uniform
      required: true
      selector:
        entity:
          domain: light
  sequence:
    - condition: template
      value_template: >-
        {{ strip_entity in ['light.kitchen_cabinet_strip',
                            'light.kitchen_island_strip']
           and is_state(strip_entity, 'on') }}
    - action: lifx.effect_stop
      target:
        entity_id: "{{ strip_entity }}"
      continue_on_error: true
    - variables:
        saved_mode: "{{ state_attr(strip_entity, 'color_mode') }}"
        saved_hs: "{{ state_attr(strip_entity, 'hs_color') }}"
        saved_brightness: >-
          {{ state_attr(strip_entity, 'brightness')
             | int(168 if strip_entity == 'light.kitchen_cabinet_strip' else 126) }}
        saved_kelvin: >-
          {{ state_attr(strip_entity, 'color_temp_kelvin')
             | int(8696 if strip_entity == 'light.kitchen_cabinet_strip' else 9000) }}
    - choose:
        - conditions: "{{ saved_mode == 'hs' and saved_hs is not none }}"
          sequence:
            - action: lifx.set_state
              target:
                entity_id: "{{ strip_entity }}"
              data:
                brightness: "{{ saved_brightness }}"
                hs_color: "{{ saved_hs }}"
                transition: 0
                zones: "{{ range(0, 80) | list }}"
      default:
        - action: lifx.set_state
          target:
            entity_id: "{{ strip_entity }}"
          data:
            brightness: "{{ saved_brightness }}"
            color_temp_kelvin: "{{ saved_kelvin }}"
            transition: 0
            zones: "{{ range(0, 80) | list }}"

normalize_kitchen_lifx_strips:
  alias: Normalize both kitchen LIFX strips to solid colors
  mode: queued
  max: 10
  sequence:
    - parallel:
        - action: script.normalize_kitchen_lifx_strip
          data:
            strip_entity: light.kitchen_cabinet_strip
        - action: script.normalize_kitchen_lifx_strip
          data:
            strip_entity: light.kitchen_island_strip

normalize_kitchen_lifx_strips_after_scene:
  alias: Normalize kitchen LIFX strips after a scene
  mode: restart
  sequence:
    - delay: "00:00:01"
    - action: script.normalize_kitchen_lifx_strips
    - delay: "00:00:01"
    - action: script.normalize_kitchen_lifx_strips

activate_lighting_scene:
  alias: Activate a lighting scene with solid LIFX colors
  mode: restart
  fields:
    scene_entity:
      name: Scene
      description: Scene entity to activate
      required: true
      selector:
        entity:
          domain: scene
  sequence:
    - action: script.turn_off
      target:
        entity_id:
          - script.normalize_kitchen_lifx_strips_after_scene
          - script.normalize_kitchen_lifx_strips
          - script.normalize_kitchen_lifx_strip
    - action: switch.turn_off
      target:
        entity_id: switch.circadian_lighting_circadian_lighting
      continue_on_error: true
    - action: lifx.effect_stop
      target:
        entity_id:
          - light.kitchen_cabinet_strip
          - light.kitchen_island_strip
      continue_on_error: true
    - action: scene.turn_on
      target:
        entity_id: "{{ scene_entity }}"
    - action: script.turn_on
      target:
        entity_id: script.normalize_kitchen_lifx_strips_after_scene

activate_party_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.party

activate_movie_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.movie_dinner

activate_relax_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.romantic
