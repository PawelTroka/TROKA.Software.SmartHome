# general

do_nothing:
  sequence: []

turn_off_everything:
  sequence:
    - service: switch.turn_off
      entity_id: switch.bathroom_mirror_switch_demister
    - service: light.turn_off
      entity_id: group.all_lights
    - service: climate.turn_off
      entity_id: group.all_climate
    - service: script.turn_on
      entity_id: script.turn_off_media_everywhere

turn_off_media_and_lights_everywhere_except_bedroom:
  sequence:
    - service: light.turn_off
      entity_id: group.all_lights_except_bedroom
    - service: script.turn_on
      entity_id: script.turn_off_media_everywhere_except_bedroom

turn_off_lights_and_tv_in_bedroom:
  sequence:
    - service: light.turn_off
      entity_id: group.bedroom_lights
    - service: script.turn_on
      entity_id: script.turn_off_bedroom_tv

turn_on_necessary_things:
  sequence:
    - service: script.turn_on
      entity_id: script.turn_on_heating_everywhere_except_bedroom_and_office

flash_all_lights:
  sequence:
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights
    - delay: '00:00:01' 
    - service: light.toggle
      entity_id: group.all_lights

activate_lighting_scene:
  alias: Activate a lighting scene with solid LIFX colors
  mode: queued
  max: 10
  fields:
    scene_entity:
      name: Scene
      description: Scene entity to activate
      required: true
      selector:
        entity:
          domain: scene
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.circadian_lighting_circadian_lighting
      continue_on_error: true
    - action: lifx.effect_stop
      target:
        entity_id:
          - light.kitchen_cabinet_strip
          - light.kitchen_island_strip
      continue_on_error: true
    - action: scene.turn_on
      target:
        entity_id: "{{ scene_entity }}"
    - delay: "00:00:01"
    - action: lifx.effect_stop
      target:
        entity_id:
          - light.kitchen_cabinet_strip
          - light.kitchen_island_strip
      continue_on_error: true

activate_party_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.party_2

activate_movie_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.movie_dinner

activate_relax_mode:
  sequence:
    - action: script.activate_lighting_scene
      data:
        scene_entity: scene.romantic
