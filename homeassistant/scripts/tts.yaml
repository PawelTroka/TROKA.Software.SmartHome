announce_everywhere:
  variables:
    announcement_text: >-
      {{ [title | default('', true), message | default('', true)]
         | select | join(' ') }}
  sequence:
    - action: script.sonos_say
      data:
        sonos_entity: group.all_sonos_except_living_room
        volume: 0.5
        message: "{{ announcement_text }}"
      continue_on_error: true
    - action: tts.speak
      target:
        entity_id: tts.pico_tts_en_us
      data:
        media_player_entity_id: media_player.living_room_speaker
        message: "{{ announcement_text }}"
      continue_on_error: true
    - action: script.alexa_say
      data:
        entity_id: group.all_echos
        volume: 0.6
        message: "{{ announcement_text }}"
      continue_on_error: true

alexa_say:
  sequence:
    - service: notify.alexa_media
      data_template:
        target: "{{ entity_id|default('group.all_echos') }}"
        message: "{{ message }}"
        data:
          type: tts
          method: all

sonos_say:
  alias: "Sonos TTS script"
  variables:
    requested_sonos_entity: >-
      {{ sonos_entity | default('group.all_sonos_except_living_room', true) }}
    sonos_targets: >-
      {{ expand(requested_sonos_entity)
         | selectattr('domain', 'eq', 'media_player')
         | rejectattr('state', 'in', ['unknown', 'unavailable'])
         | map(attribute='entity_id') | list }}
  sequence:
    - condition: template
      value_template: "{{ sonos_targets | count > 0 }}"
    - action: sonos.snapshot
      target:
        entity_id: "{{ sonos_targets }}"
      data:
        with_group: true
    - action: media_player.unjoin
      target:
        entity_id: "{{ sonos_targets }}"
    - action: media_player.volume_set
      target:
        entity_id: "{{ sonos_targets }}"
      data:
        volume_level: "{{ volume | default(0.5, true) }}"
    - action: tts.speak
      target:
        entity_id: tts.pico_tts_en_us
      data:
        media_player_entity_id: "{{ sonos_targets }}"
        message: "{{ message }}"
    - delay: "{{ delay|default('00:00:01') }}"
    - wait_template: >-
        {{ expand(sonos_targets)
           | selectattr('state', 'eq', 'playing') | list | count > 0 }}
      timeout: '00:00:03'
      continue_on_timeout: true
    - wait_template: >-
        {{ expand(sonos_targets)
           | selectattr('state', 'eq', 'playing') | list | count == 0 }}
      timeout: '00:01:00'
      continue_on_timeout: true
    - action: sonos.restore
      target:
        entity_id: "{{ sonos_targets }}"
      data:
        with_group: true
