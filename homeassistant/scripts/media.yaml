turn_off_media_everywhere:
  sequence:
    - service: script.turn_on
      entity_id: script.turn_off_music_everywhere
    - service: script.turn_on
      entity_id: script.turn_off_tvs_everywhere

turn_off_media_everywhere_except_bedroom:
  sequence:
    - action: script.pause_sonos_group
      data:
        sonos_group: group.all_sonos_except_bedroom
    - service: script.turn_on
      entity_id: script.turn_off_denon_receiver
      continue_on_error: true
    - service: script.turn_on
      entity_id: script.turn_off_living_room_tv
      continue_on_error: true

turn_off_tvs_everywhere:
  sequence:
    - service: script.turn_on
      entity_id: script.turn_off_living_room_tv
    - service: script.turn_on
      entity_id: script.turn_off_bedroom_tv

turn_off_music_everywhere:
  sequence:
    - service: script.turn_on
      entity_id: script.turn_off_sonos_everywhere
    - service: script.turn_on
      entity_id: script.turn_off_denon_receiver

turn_off_sonos_everywhere:
  sequence:
    - action: script.pause_sonos_group
      data:
        sonos_group: group.all_sonos

pause_sonos_group:
  alias: Pause available Sonos coordinators
  mode: parallel
  max: 4
  fields:
    sonos_group:
      required: true
      selector:
        entity:
          domain: group
  variables:
    sonos_coordinators: >-
      {% set result = namespace(entity_ids=[]) %}
      {% for player in expand(sonos_group) %}
        {% set members = state_attr(player.entity_id, 'group_members') or [] %}
        {% if player.state not in ['unknown', 'unavailable']
              and (members | count == 0 or members | first == player.entity_id) %}
          {% set result.entity_ids = result.entity_ids + [player.entity_id] %}
        {% endif %}
      {% endfor %}
      {{ result.entity_ids }}
  sequence:
    - condition: template
      value_template: "{{ sonos_coordinators | count > 0 }}"
    - action: media_player.media_pause
      target:
        entity_id: "{{ sonos_coordinators }}"


# Turn ON
turn_on_bedroom_tv:
  sequence:
    - service: media_player.turn_on
      entity_id: group.all_bedroom_tvs

turn_on_living_room_tv:
  sequence:
    - service: media_player.turn_on
      entity_id: group.all_living_room_tvs_except_casts

turn_on_denon_receiver:
  sequence:
    - service: media_player.turn_on
      entity_id: media_player.denon_avc_x6500h_avr

# Turn OFF
turn_off_bedroom_tv:
  sequence:
    - service: media_player.turn_off
      entity_id: group.all_bedroom_tvs

turn_off_living_room_tv:
  sequence:
    - condition: template
      value_template: >-
        {{ states('media_player.living_room_bravia_tv')
           not in ['off', 'unknown', 'unavailable'] }}
    - service: media_player.turn_off
      entity_id: media_player.living_room_bravia_tv
      continue_on_error: true

turn_off_denon_receiver:
  sequence:
    - service: media_player.turn_off
      entity_id: media_player.denon_avc_x6500h_avr
      continue_on_error: true
