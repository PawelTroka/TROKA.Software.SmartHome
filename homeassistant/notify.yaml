#### Platforms ####

- platform: tts
  name: google_voice
  tts_service: tts.picotts_say
  media_player: group.all_google_assistant


- platform: sonos_tts
  name: sonos_voice
  entities:
    #- media_player.living_room
    - media_player.bathroom
    - media_player.bedroom
    - media_player.office
    - media_player.kitchen
    - media_player.toilet
  tts: picotts

#### Groups ####

- name: voice
  platform: group
  services:
    - service: alexa_media
      data:
        target: group.all_alexa
        data:
          type: tts
          method: all
    - service: google_voice
    #- service: sonos_voice # sonos_voice is good but alexa_media accomplishes the same and is a higher quality component

- name: apps
  platform: group
  services:
    - service: alexa_media
      data:
        target: media_player.living_room_echo
        data:
          type: push
          method: all

- name: residents
  platform: group
  services:
    - service: mobile_app_oppofindx9ultra # Pawel

- name: critical_residents
  platform: group
  services:
    - service: mobile_app_iphone_michalina # Michalina receives only critical alerts

- name: home_control_devices
  platform: group
  services:
    - service: mobile_app_ipad # Smart Tablet iPad

- name: safety_silent
  platform: group
  services:
    - service: residents
    - service: critical_residents
    - service: apps


#### Levels ####

- name: level_trace
  platform: group
  services:
    - service: residents
    - service: apps

- name: level_note
  platform: group
  services:
    - service: level_trace
    - service: home_control_devices

- name: level_info # everything_without_voice
  platform: group
  services:
    - service: level_note

- name: level_important # everything
  platform: group
  services:
    - service: level_info
    - service: critical_residents
    - service: voice
