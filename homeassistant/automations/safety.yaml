# Safety & Environment Automations
# Radon and UPS conditions are handled by template-backed alerts in alerts.yaml.

- alias: "High VOC Alert"
  trigger:
    - platform: numeric_state
      entity_id: sensor.airthings_voc
      above: 2000
      for: "00:05:00"
  action:
    - service: notify.level_info
      data:
        title: "Poor Air Quality"
        message: "VOC levels are rising. Consider opening a window."
