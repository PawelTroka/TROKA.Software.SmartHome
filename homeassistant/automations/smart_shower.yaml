# Smart Shower Automation

- alias: "Shower Mode: Start"
  trigger:
    - platform: state
      entity_id: binary_sensor.shower_in_use
      to: 'on'
  action:
    - service: light.turn_on
      target:
        entity_id: light.bathroom_lights
      data:
        brightness_pct: 80
        color_temp_kelvin: 3333 # Soft white
    # Bright task lighting is retained as a shower safety exception, but do
    # not restart whole-house music after household night mode has begun.
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.house_night_mode
              state: "off"
          sequence:
            - action: script.shower_music
    - service: notify.level_info
      data:
        message: "Shower mode activated. Enjoy!"

- alias: "Shower Mode: End"
  trigger:
    - platform: state
      entity_id: binary_sensor.shower_in_use
      from: 'on'
      to: 'off'
  action:
    - service: media_player.media_stop
      target:
        entity_id: media_player.bathroom
    - if:
        - condition: state
          entity_id: binary_sensor.bathroom_motion
          state: 'on'
      then:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.house_night_mode
                  state: "on"
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: light.bathroom_lights
                  continue_on_error: true
                - action: script.turn_on_bathroom_automatic_lights
          default:
            - action: script.set_bathroom_lights_to_default
            # If bedtime began while the normal shower profile was running,
            # never let its 100% task lighting win the race with night mode.
            - if:
                - condition: state
                  entity_id: input_boolean.house_night_mode
                  state: "on"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.bathroom_lights
                  continue_on_error: true
                - action: script.turn_on_bathroom_automatic_lights
