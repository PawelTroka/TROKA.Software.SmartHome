- id: heating_on_when_someone_gets_home
  alias: 'Turn on heating when someone gets home'
  trigger:
    - platform: state
      entity_id: group.all_persons
      to: 'home'
  condition:
    condition: and
    conditions:
      - condition: numeric_state
        entity_id: 'sensor.netatmo_outdoor_temperature'
        below: 15
      - condition: numeric_state
        entity_id: 'sensor.netatmo_indoor_temperature'
        below: 25
  action:
    - action: script.turn_on
      target:
        entity_id: script.turn_on_heating_everywhere_except_bedroom_and_office
    - action: notify.level_note
      data:
        message: Heating adjustment requested because {{ trigger.to_state.name }} got home.
        title: Heating request


- id: heating_off_when_too_warm
  alias: 'Turn off heating when it gets too warm'
  trigger:
    - platform: numeric_state
      entity_id: 'sensor.netatmo_outdoor_temperature'
      above: 20
    - platform: numeric_state
      entity_id: 'sensor.netatmo_indoor_temperature'
      above: 25
  action:
    - action: script.turn_off_heating_everywhere
      continue_on_error: true
    - action: notify.level_note
      data:
        message: Heating shutdown requested because it got too warm.
        title: Heating request


- id: heating_on_when_too_cold
  alias: 'Turn on heating when it gets too cold'
  trigger:
    - platform: numeric_state
      entity_id: 'sensor.netatmo_outdoor_temperature'
      below: 7
    - platform: numeric_state
      entity_id: 'sensor.netatmo_indoor_temperature'
      below: 20
  condition:
    condition: state # at least 1 person is at home
    entity_id: group.all_persons
    state: 'home'
  action:
    - service: script.turn_on
      target:
        entity_id: script.turn_on_heating_everywhere_except_bedroom_and_office
    - action: notify.level_note
      data:
        message: Heating adjustment requested because it got too cold.
        title: Heating request


- id: office_heating_off_when_pawel_leaves
  alias: 'Turn off office heating when Pawel leaves home' # office is used exclusively by Pawel
  trigger:
    - platform: state
      entity_id: person.pawel
      to: 'not_home'
  action:
    - action: script.turn_on
      target:
        entity_id: script.set_tado_hvac_mode_best_effort
      data:
        variables:
          climate_entity: climate.office
          hvac_mode: "off"
    - action: notify.level_note
      data:
        message: Office heating shutdown requested because Pawel left home.
        title: Office heating request

- id: office_heating_on_when_pawel_arrives
  alias: 'Turn on office heating when Pawel arrives home' # office is used exclusively by Pawel
  trigger:
    - platform: state
      entity_id: person.pawel
      to: 'home'
  condition:
    condition: and
    conditions:
      - condition: numeric_state
        entity_id: 'sensor.netatmo_outdoor_temperature'
        below: 15
      - condition: numeric_state
        entity_id: 'sensor.netatmo_indoor_temperature'
        below: 25
  action:
    - action: script.turn_on
      target:
        entity_id: script.set_tado_hvac_mode_best_effort
      data:
        variables:
          climate_entity: climate.office
          hvac_mode: heat
    - action: notify.level_note
      data:
        message: Office heating requested because Pawel arrived home.
        title: Office heating request
