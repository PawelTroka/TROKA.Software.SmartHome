
- id: update_kodi_library_when_available
  alias: Update Kodi library early in the morning
  trigger:
    platform: time
    at: "07:32:00"
  condition:
    - condition: template
      value_template: "{{ has_value('media_player.living_room_kodi') }}"
  action:
    service: script.turn_on
    entity_id: script.living_room_kodi_update_library
