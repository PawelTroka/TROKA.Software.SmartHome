# General

- id: household_both_away
  alias: Household - shut down and clean when both residents are away
  mode: single
  triggers:
    - trigger: template
      value_template: >-
        {{ states('person.pawel') not in ['home', 'unknown', 'unavailable']
           and states('person.misiuszka') not in ['home', 'unknown', 'unavailable'] }}
      for: "00:02:00"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >-
        {{ states('person.pawel') not in ['home', 'unknown', 'unavailable']
           and states('person.misiuszka') not in ['home', 'unknown', 'unavailable'] }}
  actions:
    - action: script.turn_off_everything
      continue_on_error: true
    - action: fan.turn_off
      target:
        entity_id: fan.vestfrost_air_humidifier
      continue_on_error: true
    - variables:
        roborock_was_available: >-
          {{ has_value('vacuum.roborock_s8_pro_ultra') }}
    - choose:
        - conditions: "{{ roborock_was_available }}"
          sequence:
            - action: vacuum.start
              target:
                entity_id: vacuum.roborock_s8_pro_ultra
              continue_on_error: true
            - wait_template: >-
                {{ is_state('vacuum.roborock_s8_pro_ultra', 'cleaning') }}
              timeout: "00:00:20"
              continue_on_timeout: true
    - action: notify.level_note
      data:
        title: Everything turned off
        message: >-
          Both residents are away; the home shutdown was requested.
          {% if not roborock_was_available %}
            Roborock is unavailable and was not started.
          {% elif is_state('vacuum.roborock_s8_pro_ultra', 'cleaning') %}
            Roborock started cleaning.
          {% else %}
            Roborock was available, but cleaning could not be confirmed.
          {% endif %}

- id: household_someone_home
  alias: Household - purifier on and Roborock docked when someone arrives
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - person.pawel
        - person.misiuszka
      to: "home"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >-
        {{ is_state('person.pawel', 'home')
           or is_state('person.misiuszka', 'home') }}
  actions:
    - if:
        - condition: template
          value_template: >-
            {{ has_value('vacuum.roborock_s8_pro_ultra') }}
      then:
        - action: vacuum.return_to_base
          target:
            entity_id: vacuum.roborock_s8_pro_ultra
          continue_on_error: true
    - action: fan.turn_on
      target:
        entity_id: fan.vestfrost_air_humidifier
      continue_on_error: true

- id: welcome_pawel_home
  alias: 'Say welcome Pawel when Pawel is back home'
  trigger:
    - platform: state
      entity_id: person.pawel
      from: 'not_home'
      to: 'home'
  action:
    service: script.announce_everywhere
    data:
      message: 'Welcome back Pawel!'
