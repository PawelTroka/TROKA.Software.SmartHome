# Two-resident bedtime/wake routines. Withings is Pawel's primary detector;
# Oppo is a conservative fallback. Michalina supplies explicit Sleep Focus
# intent from iOS, confirmed only while her phone is charging at home.

- id: pawel_bedtime_secure_house
  alias: "Good Night: secure house when Pawel settles in bed"
  mode: single
  triggers:
    - trigger: state
      id: withings
      entity_id: binary_sensor.withings_in_bed_pawel_t
      to: "on"
      for: "00:10:00"
    - trigger: template
      id: oppo_fallback
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {% set confidence = states('sensor.oppofindx9ultra_sleep_confidence') | float(-1) %}
        {{ states('binary_sensor.withings_in_bed_pawel_t') in ['unknown', 'unavailable']
           and confidence >= 85
           and is_state('binary_sensor.oppofindx9ultra_interactive', 'off')
           and is_state('binary_sensor.oppofindx9ultra_is_charging', 'on')
           and (minute >= 1200 or minute < 270) }}
      for: "00:20:00"
  conditions:
    - condition: state
      entity_id: person.pawel
      state: "home"
    - condition: template
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {{ minute >= 1200 or minute < 270 }}
    - condition: template
      value_template: >-
        {{ states('input_text.pawel_bedtime_night') !=
           ((as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true)) }}
  actions:
    - variables:
        night_key: >-
          {{ (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) }}
        trigger_source: >-
          {{ 'Withings bed sensor' if trigger.id == 'withings' else 'Oppo fallback' }}
    # Latch first so a temporarily unreachable lock cannot cause repeat runs.
    - action: input_text.set_value
      target:
        entity_id: input_text.pawel_bedtime_night
      data:
        value: "{{ night_key }}"
    - action: lock.lock
      target:
        entity_id: lock.smart_lock_ultra
      continue_on_error: true
    - action: script.activate_night_mode
      data:
        whole_house: >-
          {{ trigger.id == 'withings'
             and states('person.misiuszka') not in ['home', 'unknown', 'unavailable'] }}
      continue_on_error: true
    # Re-evaluate Michalina only after the bedroom actions finish. A Focus-off
    # transition during those actions must never be overridden by an old value.
    - action: script.reconcile_house_night_mode_activation
      continue_on_error: true
    - variables:
        michalina_confirmed_now: >-
          {{ is_state('person.misiuszka', 'home')
             and is_state('input_boolean.michalina_sleep_focus', 'on')
             and is_state('input_boolean.michalina_sleeping', 'on')
             and states('input_text.michalina_bedtime_night') == night_key }}
        shared_mode_active: >-
          {{ is_state('input_boolean.house_night_mode', 'on') }}
    - action: notify.level_info
      data:
        title: "Good night"
        message: >-
          Pawel bedtime detected via {{ trigger_source }}. Bedroom lights,
          screens, and music were requested off; bedroom cooling was requested
          at 18 degrees.
          {% if shared_mode_active %}
            {% if michalina_confirmed_now %}
              Michalina was independently confirmed settled, so shared lights,
              screens, and music were also requested off.
            {% else %}
              Michalina is away, so shared lights, screens, and music were also requested off.
            {% endif %}
          {% elif trigger.id == 'oppo_fallback' %}
            The conservative Oppo fallback left shared lights and media in use;
            the shared 1-percent red profile was not enabled.
          {% else %}
            Shared lights and media were left in use because Michalina is home
            or her presence is uncertain; the shared 1-percent red profile was not enabled.
          {% endif %}
          {{ 'The door reports locked.' if is_state('lock.smart_lock_ultra', 'locked')
             else 'The door lock could not be confirmed.' }}
      continue_on_error: true

- id: michalina_bedtime_confirmed_by_iphone
  alias: "Good Night: confirm Michalina from iPhone Sleep Focus"
  mode: single
  triggers:
    - trigger: template
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {{ is_state('input_boolean.michalina_sleep_focus', 'on')
           and is_state('person.misiuszka', 'home')
           and states('sensor.iphone_michalina_battery_state') in ['Charging', 'Full']
           and (minute >= 1200 or minute < 270) }}
      for: "00:20:00"
  conditions:
    - condition: template
      value_template: >-
        {{ states('input_text.michalina_bedtime_night') !=
           ((as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true)) }}
  actions:
    - variables:
        night_key: >-
          {{ (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) }}
        pawel_is_away: >-
          {{ states('person.pawel') not in ['home', 'unknown', 'unavailable'] }}
        pawel_settled_at_home: >-
          {{ is_state('person.pawel', 'home')
             and is_state('input_boolean.bedroom_night_mode', 'on')
             and states('input_text.pawel_bedtime_night') == night_key }}
    # Latch before shared actions so an unavailable media player cannot cause a
    # second shutdown attempt from the same phone state later that night.
    - action: input_text.set_value
      target:
        entity_id: input_text.michalina_bedtime_night
      data:
        value: "{{ night_key }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.michalina_sleeping
    # Activation-only reconciliation rechecks both residents after this latch;
    # it never starts Pawel's bedroom cooling or deactivates an existing mode.
    - action: script.reconcile_house_night_mode_activation
      continue_on_error: true
    - action: notify.level_info
      data:
        title: "Good night"
        message: >-
          Michalina was confirmed settled after Sleep Focus and charging at
          home for 20 minutes.
          {% if pawel_is_away %}
            Pawel is away, so shared lights, screens, and music were requested off.
          {% elif pawel_settled_at_home %}
            Pawel's bedroom night mode is active, so shared lights, screens,
            and music were requested off.
          {% else %}
            Shared rooms were left in use because Pawel is still home and awake.
          {% endif %}
      continue_on_error: true

- id: michalina_sleep_focus_off_cleanup
  alias: "Wake Up: clear Michalina after Sleep Focus turns off"
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.michalina_sleep_focus
      to: "off"
      for: "00:05:00"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.michalina_sleeping
    - action: input_text.set_value
      target:
        entity_id: input_text.michalina_bedtime_night
      data:
        value: ""
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ states('person.misiuszka') in ['home', 'unknown', 'unavailable'] }}
            - condition: state
              entity_id: input_boolean.house_night_mode
              state: "on"
          sequence:
            - action: script.deactivate_house_night_mode
              continue_on_error: true

- id: house_night_mode_reconcile_when_pawel_changes
  alias: "Night mode: reconcile shared rooms after Pawel state changes"
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id: person.pawel
      for: "00:01:05"
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.to_state is not none
           and trigger.to_state.state not in ['home', 'unknown', 'unavailable'] }}
  actions:
    # This path exists only for a stable, positively known departure. Home and
    # uncertain tracker recovery are owned by the arrival fail-open routine.
    - action: script.reconcile_house_night_mode_activation
      continue_on_error: true

- id: pawel_wake_comfort_mode
  alias: "Wake Up: Pawel comfort mode"
  mode: single
  triggers:
    # Prefer Withings out-of-bed plus a live phone signal that says awake.
    - trigger: template
      id: withings_confirmed
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {% set confidence = states('sensor.oppofindx9ultra_sleep_confidence') | float(-1) %}
        {{ is_state('binary_sensor.withings_in_bed_pawel_t', 'off')
           and (is_state('binary_sensor.oppofindx9ultra_interactive', 'on')
                or (confidence >= 0 and confidence <= 25))
           and minute >= 360 and minute < 660 }}
      for: "00:20:00"
    # If both phone signals disappear, trust 45 continuous minutes out of bed.
    - trigger: template
      id: withings_only
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {{ is_state('binary_sensor.withings_in_bed_pawel_t', 'off')
           and states('binary_sensor.oppofindx9ultra_interactive') in ['unknown', 'unavailable']
           and states('sensor.oppofindx9ultra_sleep_confidence') in ['unknown', 'unavailable']
           and minute >= 360 and minute < 660 }}
      for: "00:45:00"
    # If Withings is unavailable, require two independent awake phone signals.
    - trigger: template
      id: oppo_fallback
      value_template: >-
        {% set minute = now().hour * 60 + now().minute %}
        {% set confidence = states('sensor.oppofindx9ultra_sleep_confidence') | float(-1) %}
        {{ states('binary_sensor.withings_in_bed_pawel_t') in ['unknown', 'unavailable']
           and is_state('binary_sensor.oppofindx9ultra_interactive', 'on')
           and confidence >= 0 and confidence <= 25
           and minute >= 360 and minute < 660 }}
      for: "00:10:00"
  conditions:
    - condition: state
      entity_id: person.pawel
      state: "home"
    - condition: template
      value_template: >-
        {% set night_key = (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) %}
        {{ states('input_text.pawel_bedtime_night') == night_key
           and states('input_text.pawel_wake_night') != night_key }}
  actions:
    - variables:
        night_key: >-
          {{ (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) }}
    - action: input_text.set_value
      target:
        entity_id: input_text.pawel_wake_night
      data:
        value: "{{ night_key }}"
    - action: climate.turn_off
      target:
        entity_id: climate.bedroom_ac
      continue_on_error: true
    - action: script.deactivate_night_mode
      continue_on_error: true
    - wait_template: "{{ is_state('climate.bedroom_ac', 'off') }}"
      timeout: "00:00:20"
      continue_on_timeout: true
    - choose:
        - conditions:
            - condition: state
              entity_id: climate.bedroom_ac
              state: "off"
            - condition: state
              entity_id: input_boolean.bedroom_night_mode
              state: "off"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.bedroom_ac_night_cooling
    - action: script.turn_on_heating_everywhere_except_bedroom_and_office
      continue_on_error: true

- id: night_mode_daytime_failsafe
  alias: "Night mode: daytime failsafe"
  mode: single
  triggers:
    - trigger: time_pattern
      id: scheduled
      minutes: "/15"
    - trigger: homeassistant
      id: startup
      event: start
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'startup' }}"
          sequence:
            - delay: "00:00:30"
    - variables:
        should_end_night_mode: >-
          {% set minute = now().hour * 60 + now().minute %}
          {% set current_night = (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) %}
          {{ (minute >= 660 and minute < 1200)
             or (states('input_text.pawel_bedtime_night') != current_night
                 and states('input_text.michalina_bedtime_night') != current_night) }}
        should_clear_michalina_state: >-
          {% set minute = now().hour * 60 + now().minute %}
          {% set current_night = (as_timestamp(now()) - 64800) | timestamp_custom('%Y-%m-%d', true) %}
          {% set focus = states.input_boolean.michalina_sleep_focus %}
          {% set focus_off_stable =
             is_state('input_boolean.michalina_sleep_focus', 'off')
             and (trigger.id == 'startup'
                  or (focus is not none
                      and as_timestamp(now()) - as_timestamp(focus.last_changed) >= 300)) %}
          {% set bedtime_key = states('input_text.michalina_bedtime_night') %}
          {% set has_latched_state =
             is_state('input_boolean.michalina_sleeping', 'on')
             or bedtime_key not in ['', 'unknown', 'unavailable'] %}
          {{ (focus_off_stable and has_latched_state)
             or (minute >= 660 and minute < 1080)
             or (bedtime_key not in ['', 'unknown', 'unavailable']
                 and bedtime_key != current_night) }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ should_end_night_mode
                   and (is_state('input_boolean.bedroom_night_mode', 'on')
                        or is_state('input_boolean.house_night_mode', 'on')
                        or is_state('input_boolean.circadian_lighting_was_on', 'on')) }}
          sequence:
            - action: script.deactivate_night_mode
              continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ should_clear_michalina_state
                   and (is_state('input_boolean.michalina_sleep_focus', 'on')
                        or is_state('input_boolean.michalina_sleeping', 'on')
                        or states('input_text.michalina_bedtime_night')
                           not in ['', 'unknown', 'unavailable']) }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.michalina_sleep_focus
                  - input_boolean.michalina_sleeping
            - action: input_text.set_value
              target:
                entity_id: input_text.michalina_bedtime_night
              data:
                value: ""
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ states('person.misiuszka') in ['home', 'unknown', 'unavailable'] }}
                    - condition: state
                      entity_id: input_boolean.house_night_mode
                      state: "on"
                  sequence:
                    - action: script.deactivate_house_night_mode
                      continue_on_error: true
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.bedroom_night_mode
              state: "off"
            - condition: state
              entity_id: input_boolean.bedroom_ac_night_cooling
              state: "on"
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.bedroom_ac
              continue_on_error: true
            - wait_template: "{{ is_state('climate.bedroom_ac', 'off') }}"
              timeout: "00:00:20"
              continue_on_timeout: true
            - choose:
                - conditions:
                    - condition: state
                      entity_id: climate.bedroom_ac
                      state: "off"
                    - condition: state
                      entity_id: input_boolean.bedroom_night_mode
                      state: "off"
                  sequence:
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.bedroom_ac_night_cooling
- id: house_night_mode_disable_when_michalina_arrives
  alias: "Night mode: restore shared rooms when a resident arrives"
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id:
        - person.pawel
        - person.misiuszka
      to: "home"
      for: "00:01:00"
  actions:
    - variables:
        genuine_arrival: >-
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['home', 'unknown', 'unavailable']
             and (as_timestamp(trigger.to_state.last_changed)
                  - as_timestamp(trigger.from_state.last_changed)) >= 300 }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.entity_id == 'person.misiuszka'
                   and (genuine_arrival | bool) }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.michalina_sleep_focus
                  - input_boolean.michalina_sleeping
            - action: input_text.set_value
              target:
                entity_id: input_text.michalina_bedtime_night
              data:
                value: ""
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.entity_id == 'person.pawel'
                   and (genuine_arrival | bool) }}
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.pawel_bedtime_night
              data:
                value: ""
            # End Pawel's personal scope only when bedtime automation owns it;
            # never shut down manually requested bedroom cooling on arrival.
            - choose:
                - conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: input_boolean.bedroom_night_mode
                          state: "on"
                        - condition: state
                          entity_id: input_boolean.bedroom_ac_night_cooling
                          state: "on"
                  sequence:
                    - action: climate.turn_off
                      target:
                        entity_id: climate.bedroom_ac
                      continue_on_error: true
                    - action: script.deactivate_night_mode
                      continue_on_error: true
                    - wait_template: "{{ is_state('climate.bedroom_ac', 'off') }}"
                      timeout: "00:00:20"
                      continue_on_timeout: true
                    - choose:
                        - conditions:
                            - condition: state
                              entity_id: climate.bedroom_ac
                              state: "off"
                            - condition: state
                              entity_id: input_boolean.bedroom_night_mode
                              state: "off"
                          sequence:
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.bedroom_ac_night_cooling
    # Always release shared mode after a confirmed home transition. This is
    # idempotent and closes races with a concurrent bedtime reconciliation.
    - action: script.deactivate_house_night_mode
      continue_on_error: true
    # If the door/motion event won the race with presence detection, replace
    # an already-lit red hallway instead of awaiting another motion cycle.
    - choose:
        - conditions:
            - condition: state
              entity_id: sun.sun
              state: "below_horizon"
            - condition: state
              entity_id: light.hallway_lights
              state: "on"
          sequence:
            - action: script.set_hallway_lights_to_default
              continue_on_error: true
