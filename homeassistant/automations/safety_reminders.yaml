- id: remind_about_current_safety_failures
  alias: "Safety: Remind about current monitoring failures"
  mode: single
  trigger:
    - platform: homeassistant
      event: start
      id: startup
    - platform: time
      at: "10:00:00"
      id: daily
  action:
    - if: "{{ trigger.id == 'startup' }}"
      then:
        - delay: "00:00:30"
    - parallel:
        - if:
            - condition: state
              entity_id: binary_sensor.ups_telemetry_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.ups_telemetry_unavailable
              state: 'idle'
          then:
            - action: notify.level_important
              data:
                title: "UPS input monitoring unavailable"
                message: >-
                  UPS input-voltage telemetry is missing, so mains-power outage
                  detection is unavailable.
        - if:
            - condition: state
              entity_id: binary_sensor.airthings_monitor_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.airthings_monitor_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Airthings monitoring unavailable"
                message: Radon and VOC safety alerts cannot operate until Airthings is restored.
        - if:
            - condition: state
              entity_id: binary_sensor.bathroom_leak_sensor_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.bathroom_leak_sensor_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Bathroom leak monitoring unavailable"
                message: The bathroom leak sensor is not reporting, so leak protection is unreliable.
        - if:
            - condition: state
              entity_id: binary_sensor.tado_heating_control_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.tado_heating_control_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Tado heating control unavailable"
                message: Tado radiator data is stale, so heating commands may not take effect.
        - if:
            - condition: state
              entity_id: binary_sensor.front_door_contact_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.front_door_contact_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Front door contact unavailable"
                message: The door-left-open alert is blind until the contact sensor reports again.
        - if:
            - condition: state
              entity_id: binary_sensor.front_door_lock_not_confirmed_locked
              state: 'on'
            - condition: state
              entity_id: alert.front_door_left_unlocked
              state: 'idle'
          then:
            - action: notify.level_important
              data:
                title: "Front door lock is not confirmed"
                message: >-
                  The front door is not confirmed locked. Current lock state:
                  {{ states('lock.smart_lock_ultra') }}.
        - if:
            - condition: state
              entity_id: binary_sensor.front_door_lock_monitoring_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.front_door_lock_monitoring_unavailable
              state: 'idle'
          then:
            - action: notify.level_important
              data:
                title: "Front door lock monitoring unavailable"
                message: The smart lock is unavailable; check the door manually.
        - if:
            - condition: state
              entity_id: binary_sensor.co2_above_1000_ppm
              state: 'on'
            - condition: state
              entity_id: alert.co2_above_1000_ppm
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Elevated CO2 detected"
                message: >-
                  {{ state_attr('binary_sensor.co2_above_1000_ppm', 'readings') }}.
                  Ventilate the affected room.
        - if:
            - condition: state
              entity_id: binary_sensor.co2_above_2000_ppm
              state: 'on'
            - condition: state
              entity_id: alert.co2_above_2000_ppm
              state: 'idle'
          then:
            - action: notify.safety_silent
              data:
                title: "Serious CO2 ventilation warning"
                message: >-
                  {{ state_attr('binary_sensor.co2_above_2000_ppm', 'readings') }}.
                  Ventilate the affected room now.
        - if:
            - condition: state
              entity_id: binary_sensor.co2_monitoring_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.co2_monitoring_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "CO2 monitoring unavailable"
                message: >-
                  One or more expected Netatmo room CO2 readings are unavailable,
                  so ventilation alerts are incomplete.
        - if:
            - condition: state
              entity_id: binary_sensor.cooktop_unattended
              state: 'on'
            - condition: state
              entity_id: alert.cooktop_unattended
              state: 'idle'
          then:
            - action: notify.safety_silent
              data:
                title: "Cooktop unattended"
                message: The cooktop reports active while the home is away or in shared night mode.
        - if:
            - condition: state
              entity_id: binary_sensor.cooktop_monitoring_unavailable
              state: 'on'
            - condition: state
              entity_id: alert.cooktop_monitoring_unavailable
              state: 'idle'
          then:
            - action: notify.level_info
              data:
                title: "Cooktop monitoring unavailable"
                message: Unattended-cooking detection is blind until Home Connect telemetry returns.
