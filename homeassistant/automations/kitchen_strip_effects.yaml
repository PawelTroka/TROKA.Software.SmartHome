- id: stop_kitchen_strip_effects_when_turned_on
  alias: Keep kitchen LIFX strips solid when turned on
  initial_state: true
  mode: parallel
  max: 2
  triggers:
    - trigger: state
      entity_id:
        - light.kitchen_cabinet_strip
        - light.kitchen_island_strip
      to: "on"
  actions:
    - variables:
        strip_entity: "{{ trigger.entity_id }}"
    - action: script.normalize_kitchen_lifx_strip
      data:
        strip_entity: "{{ strip_entity }}"
    - delay: "00:00:01"
    - action: script.normalize_kitchen_lifx_strip
      data:
        strip_entity: "{{ strip_entity }}"
