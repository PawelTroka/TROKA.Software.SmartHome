# Bathroom multisensor

- id: bathroom_motion_turn_on_lights
  alias: Turn on bathroom lights on motion
  trigger:
    - platform: state
      entity_id: binary_sensor.bathroom_motion
      to: 'on'
  action:
    action: script.turn_on_bathroom_automatic_lights


- id: bathroom_motion_turn_off_lights_unless_showering
  alias: Turn off bathroom lights when motion stops unless shower is in use
  trigger:
    - platform: state
      entity_id: binary_sensor.bathroom_motion
      from: 'on'
      to: 'off'
  condition:
    - condition: state
      entity_id: 'binary_sensor.shower_in_use'
      state: 'off'
  action:
    service: light.turn_off
    entity_id: light.bathroom_lights


- id: bathroom_shower_end_turn_off_lights_without_motion
  alias: Turn off bathroom lights when shower is over unless there is motion
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'on'
    to: 'off'
  condition:
    - condition: state
      entity_id: 'binary_sensor.bathroom_motion'
      state: 'off'
  action:
    service: light.turn_off
    entity_id: light.bathroom_lights


- id: bathroom_shower_turn_on_demister
  alias: Turn on bathroom mirror demister when shower is in use
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'off'
    to: 'on'
  action:
    service: switch.turn_on
    entity_id: switch.bathroom_mirror_switch_demister


- id: bathroom_shower_turn_off_demister
  alias: Turn off bathroom mirror demister when shower is over
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'on'
    to: 'off'
  action:
    service: switch.turn_off
    entity_id: switch.bathroom_mirror_switch_demister
