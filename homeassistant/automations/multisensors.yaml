# Bathroom multisensor

- alias: Turn on bathroom lights on motion
  trigger:
    - platform: state
      entity_id: binary_sensor.bathroom_motion
      to: 'on'
  action:
    action: script.turn_on_automatic_lights
    data:
      day_profile: script.set_bathroom_lights_to_default
      night_lights:
        - light.bathroom_strip
      night_mode: input_boolean.house_night_mode


- alias: Turn off bathroom lights when motion stops unless shower is in use
  trigger:
    - platform: state
      entity_id: binary_sensor.bathroom_motion
      to: 'off'
  condition:
    - condition: state
      entity_id: 'binary_sensor.shower_in_use'
      state: 'off'
  action:
    service: light.turn_off
    entity_id: light.bathroom_lights


- alias: Turn off bathroom lights when shower is over unless there is motion
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'on'
    to: 'off'
  condition:
    - condition: state
      entity_id: 'binary_sensor.bathroom_motion'
      state: 'off'
  action:
    service: light.turn_off
    entity_id: light.bathroom_lights


- alias: Turn on bathroom mirror demister when shower is in use
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'off'
    to: 'on'
  action:
    service: switch.turn_on
    entity_id: switch.bathroom_mirror_switch_demister


- alias: Turn off bathroom mirror demister when shower is over
  trigger:
    platform: state
    entity_id: 'binary_sensor.shower_in_use'
    from: 'on'
    to: 'off'
  action:
    service: switch.turn_off
    entity_id: switch.bathroom_mirror_switch_demister
