# Hallway multisensor

- alias: Turn on hallway lights on motion when dark
  trigger:
    - platform: state
      entity_id: binary_sensor.hallway_multisensor_motion
      to: 'on'
  condition:
      condition: or  # 'when dark' condition: either after sunset or before sunrise - equivalent to a state condition on `sun.sun` of `below_horizon`
      conditions:
        - condition: sun
          after: sunset
        - condition: sun
          before: sunrise
  action:
    action: script.turn_on_automatic_lights
    data:
      day_profile: script.set_hallway_lights_to_default
      night_lights:
        - light.hallway_strip
      night_mode: input_boolean.house_night_mode

- alias: Turn off hallway lights when motion stops
  trigger:
    - platform: state
      entity_id: binary_sensor.hallway_multisensor_motion
      to: 'off'
  action:
    service: light.turn_off
    entity_id: light.hallway_lights


# kitchen multisensor

- alias: Turn on kitchen lights on motion when dark
  trigger:
    - platform: state
      entity_id: binary_sensor.kitchen_multisensor_motion
      to: 'on'
  condition:
      condition: or  # 'when dark' condition: either after sunset or before sunrise - equivalent to a state condition on `sun.sun` of `below_horizon`
      conditions:
        - condition: sun
          after: sunset
        - condition: sun
          before: sunrise
  action:
    - action: script.turn_on_automatic_lights
      data:
        day_profile: script.set_kitchen_lights_to_default
        night_lights:
          - light.kitchen_cabinet_strip
          - light.kitchen_island_strip
        night_mode: input_boolean.house_night_mode
    - delay: "00:00:01"
    - service: script.normalize_kitchen_lifx_strips

- alias: Turn off kitchen lights when motion stops
  trigger:
    - platform: state
      entity_id: binary_sensor.kitchen_multisensor_motion
      to: 'off'
  action:
    service: light.turn_off
    entity_id: light.kitchen_lights


