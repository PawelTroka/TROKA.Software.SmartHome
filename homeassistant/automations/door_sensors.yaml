# Bedroom door sensor

- alias: Turn bedroom lights on door open
  trigger:
    platform: state
    entity_id: binary_sensor.bedroom_door_opening_sensor_window_door_is_open
    to: 'on'
  condition:
      condition: or  # 'when dark' condition: either after sunset or before sunrise - equivalent to a state condition on `sun.sun` of `below_horizon`
      conditions:
        - condition: sun
          after: sunset
        - condition: sun
          before: sunrise
  action:
    action: script.turn_on_bedroom_automatic_lights


- alias: Say welcome on bedroom door open
  trigger:
    platform: state
    entity_id: binary_sensor.bedroom_door_opening_sensor_window_door_is_open
    to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.bedroom_night_mode
      state: "off"
  action:
    service: script.sonos_say
    data:
      sonos_entity: media_player.bedroom
      message: 'Welcome to the bedroom!'

