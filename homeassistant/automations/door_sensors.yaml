# Bathroom door sensor

- alias: Turn bathroom lights on door open
  trigger:
    platform: state
    entity_id: binary_sensor.bathroom_door_opening_senor_window_door_is_open
    to: 'on'
  action:
    action: script.turn_on_bathroom_automatic_lights

- alias: Say welcome on bathroom door open
  trigger:
    platform: state
    entity_id: binary_sensor.bathroom_door_opening_senor_window_door_is_open
    to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.house_night_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.bedroom_night_mode
      state: "off"
  action:
    service: script.announce_everywhere
    data:
      message: 'Motion in bathroom!'

- alias: Turn off bathroom lights on door close if there is no motion inside and shower not in use
  trigger:
    platform: state
    entity_id: binary_sensor.bathroom_door_opening_senor_window_door_is_open
    to: 'off'
    for:
      seconds: 90
  condition:
    - condition: state
      entity_id: 'binary_sensor.bathroom_multisensor_motion'
      state: 'off'
      for:
        seconds: 90
    - condition: state
      entity_id: binary_sensor.shower_in_use
      state: 'off'
  action:
    service: light.turn_off
    entity_id: light.bathroom_lights


