announcement:
  name: Announcement
  icon: mdi:voice
  initial: ""
  max: 255

# Restored date keys prevent bedtime and wake routines from running more than
# once for the same night, including across Home Assistant restarts.
pawel_bedtime_night:
  name: Pawel bedtime routine night
  icon: mdi:bed-clock
  max: 10

pawel_wake_night:
  name: Pawel wake routine night
  icon: mdi:weather-sunset-up
  max: 10

michalina_bedtime_night:
  name: Michalina bedtime routine night
  icon: mdi:bed-clock
  max: 10

# Short restored ring buffers make meeting reminders resilient to Home
# Assistant restarts and deduplicate overlapping/native catch-up triggers.
meeting_reminder_sent_keys:
  name: Meeting reminder sent keys
  icon: mdi:calendar-check
  max: 255

meeting_reminder_acknowledged_keys:
  name: Meeting reminder acknowledged keys
  icon: mdi:calendar-check-outline
  max: 255
