      - "traefik.backend=nvr"
      - "traefik.frontend.rule=Host:nvr.${DOMAINNAME}"
      - "traefik.port=8080"
      - "traefik.docker.network=traefik_proxy"

############################# DATABASE

# phpMyAdmin - Database management
# Create a new user with admin privileges. Cannot login as root.
  phpmyadmin:
    hostname: phpmyadmin
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: always
    links:
      - mariadb:db
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      - PMA_HOST=${DB_HOST}
      - PMA_PORT=${DB_PORT}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

# MariaDB – Database Server for your Apps
  mariadb:
    image: "linuxserver/mariadb@sha256:b20cdf0ea4148ef800f9459078e93ba2388df6db786c4b9848fd20b5ebb0d3fa"
    container_name: "mariadb"
    hostname: ${DB_HOST}
    volumes:
        - ${HOMESERVERDIR}/mariadb:/config
        - ${HOMESERVERDIR}/mariadb/mysqld:/var/run/mysqld # unix socket volume share for blazing fast MySQL communication on local network
        - ${HOMESERVERDIR}/mariadb-init/10-logrotate-auth.sh:/custom-cont-init.d/10-logrotate-auth.sh:ro
        - ${HOMESERVERDIR}/mariadb-init/mariadb.logrotate:/defaults/mariadb.logrotate.homeserver:ro
    ports:
      - target: ${DB_PORT}
        published: ${DB_PORT}
        protocol: tcp
        mode: host
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # MariaDB 11.4+ defaults to waiting for a replica before expiring binlogs.
      # This server is standalone, so retain ten days, cap usage, and rotate errors.
      - CLI_OPTS=--log-error=/config/log/mysql/mariadb.log --slave-connections-needed-for-purge=0 --binlog-expire-logs-seconds=864000 --max-binlog-total-size=5368709120
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

############################# STORAGE

# Nextcloud – private cloud storage with its own supported database
  nextcloud-db:
    image: mariadb:10.11.18@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
    container_name: nextcloud-db
    hostname: nextcloud-db
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --innodb-file-per-table=1
    env_file:
      - ${HOMESERVERDIR}/nextcloud/mariadb.env
    volumes:
      - ${HOMESERVERDIR}/nextcloud/database-10.11:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  nextcloud:
    image: nextcloud:34.0.3-apache@sha256:368cd1c75bc4a32c2aee8a119cae31bcebff80c374782f404c440c3295726814
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - default
      - traefik_proxy
    volumes:
      - ${HOMESERVERDIR}/nextcloud/html:/var/www/html
      - ${STORAGEDIR}/shared_data:/var/www/html/data
      - ${HOMESERVERDIR}/shared:/shared
      - /etc/localtime:/etc/localtime:ro
    environment:
      - APACHE_DISABLE_REWRITE_IP=1
      - TRUSTED_PROXIES=${TRAEFIK_PROXY_SUBNET:-172.18.0.0/16}
      - OVERWRITEHOST=cloud.${DOMAINNAME}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://cloud.${DOMAINNAME}
      - NEXTCLOUD_INIT_HTACCESS=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/status.php | grep -q '\"maintenance\":false'"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.backend=nextcloud"
      - "traefik.frontend.rule=Host:cloud.${DOMAINNAME}"
      - "traefik.port=80"
      - "traefik.protocol=http"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
      - "traefik.frontend.headers.STSSeconds=31536000"
      - "traefik.frontend.headers.STSIncludeSubdomains=true"
      - "traefik.frontend.headers.STSPreload=true"
      - "traefik.frontend.headers.forceSTSHeader=true"
      - "traefik.frontend.headers.browserXSSFilter=true"
      - "traefik.frontend.headers.contentTypeNosniff=true"
      - "traefik.frontend.redirect.regex=^https?://cloud[.]${DOMAINNAME}/[.]well-known/(card|cal)dav/?"
      - "traefik.frontend.redirect.replacement=https://cloud.${DOMAINNAME}/remote.php/dav/"
      - "traefik.frontend.redirect.permanent=true"

  nextcloud-cron:
    image: nextcloud:34.0.3-apache@sha256:368cd1c75bc4a32c2aee8a119cae31bcebff80c374782f404c440c3295726814
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ${HOMESERVERDIR}/nextcloud/html:/var/www/html
      - ${STORAGEDIR}/shared_data:/var/www/html/data
      - ${HOMESERVERDIR}/shared:/shared
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TRUSTED_PROXIES=${TRAEFIK_PROXY_SUBNET:-172.18.0.0/16}
      - OVERWRITEHOST=cloud.${DOMAINNAME}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://cloud.${DOMAINNAME}


############################# DOWNLOADING

# TransmissionBT - Torrent Downloader
# ONLY ACCESSIBLE THROUGH https://domain.com/transmission/web/ if using PathPrefix
  transmission-vpn:
    image: haugene/transmission-openvpn
    container_name: transmission-vpn
    hostname: transmission
    restart: unless-stopped
    networks:
      - traefik_proxy
    ports:
    - "${TRANSMISSION_PORT}:9091"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CACHEDIR}/transmission-vpn:/data
      - ${HOMESERVERDIR}/shared:/shared
      - ${CACHEDIR}/Downloads:/data/watch
      - ${STORAGEDIR}/Downloads/completed:/downloads/completed
      - ${CACHEDIR}/Downloads/incomplete:/downloads/incomplete
    environment:
      - OPENVPN_PROVIDER=NORDVPN
      - OPENVPN_USERNAME=${NORDVPN_USERNAME}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - OPENVPN_OPTS=--inactive 3600 --ping 10 --ping-exit 60
      #- NORDVPN_PROTOCOL=tcp
      #- NORDVPN_CATEGORY=P2P
      #- ENABLE_UFW=false
      - LOCAL_NETWORK=192.168.1.0/24,10.10.10.0/24
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED=true
      - TRANSMISSION_RPC_HOST_WHITELIST="127.0.0.1,192.168.*.*,10.10.10.*"
      - TRANSMISSION_RPC_PASSWORD=${TRANSMISSION_RPC_PASSWORD}
      - TRANSMISSION_RPC_USERNAME=${TRANSMISSION_RPC_USERNAME}
      - TRANSMISSION_CACHE_SIZE_MB=64
      #- TRANSMISSION_UMASK="002"
      - TRANSMISSION_RATIO_LIMIT=0.01
      - TRANSMISSION_RATIO_LIMIT_ENABLED=true
      - TRANSMISSION_ALT_SPEED_DOWN=2000
      - TRANSMISSION_ALT_SPEED_ENABLED=false
      - TRANSMISSION_ALT_SPEED_UP=15
      - TRANSMISSION_SPEED_LIMIT_DOWN=6000
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=false
      - TRANSMISSION_SPEED_LIMIT_UP=30
      - TRANSMISSION_SPEED_LIMIT_UP_ENABLED=false
      - TRANSMISSION_DOWNLOAD_QUEUE_SIZE=5000
      - TRANSMISSION_DOWNLOAD_QUEUE_ENABLED=false
      - TRANSMISSION_INCOMPLETE_DIR=/downloads/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
      - TRANSMISSION_WATCH_DIR=/downloads
      - TRANSMISSION_WATCH_DIR_ENABLED=true
      - TRANSMISSION_DOWNLOAD_DIR=/downloads/completed
      - TRANSMISSION_MAX_PEERS_GLOBAL=65000
      - TRANSMISSION_PEER_LIMIT_GLOBAL=65000
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=65000
      - TRANSMISSION_ENCRYPTION=2
      - TRANSMISSION_DHT_ENABLED=true
      - TRANSMISSION_LPD_ENABLED=false
      - TRANSMISSION_PEX_ENABLED=true
      - TRANSMISSION_UTP_ENABLED=false
    labels:
      - "traefik.enable=true"
      - "traefik.backend=transmission-vpn"
#      - "traefik.frontend.rule=Host:${DOMAINNAME}; PathPrefix: /transmission"
      - "traefik.frontend.rule=Host:downloader.${DOMAINNAME}"
      - "traefik.port=9091"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
