version: "3.7"

########################### ENV VARIABLES

x-common-variables: &common-variables
  OUTDOOR_LEFT_CAM_IMAGE_URL: http://10.10.10.101/cgi-bin/api.cgi?cmd=Snap&channel=0&rs=wuuPhkmUCeI9WG7C&user=${OUTDOOR_LEFT_CAM_USER}&password=${OUTDOOR_LEFT_CAM_PASSWORD}
  OUTDOOR_LEFT_CAM_STREAM_URL: rtsp://${OUTDOOR_LEFT_CAM_USER}:${OUTDOOR_LEFT_CAM_PASSWORD}@10.10.10.101:554/h264Preview_01_main
  OFFICE_CAM_STREAM_URL: rtsp://${OFFICE_CAM_USER}:${OFFICE_CAM_PASSWORD}@10.10.10.51/live
  OFFICE_CAM_COMMAND: -rtsp_transport udp -i rtsp://${OFFICE_CAM_USER}:${OFFICE_CAM_PASSWORD}@10.10.10.51/live
  LIVING_ROOM_RELAX_AREA_CAM_STREAM_URL: rtsp://${LIVING_ROOM_RELAX_AREA_CAM_USER}:${LIVING_ROOM_RELAX_AREA_CAM_PASSWORD}@10.10.10.49/live
  LIVING_ROOM_RELAX_AREA_CAM_COMMAND: -rtsp_transport udp -i rtsp://${LIVING_ROOM_RELAX_AREA_CAM_USER}:${LIVING_ROOM_RELAX_AREA_CAM_PASSWORD}@10.10.10.49/live
  MARIA_DB_URL: mysql://${USER}:${MYSQL_ROOT_PASSWORD}@localhost:${DB_PORT}/home_assistant?charset=utf8
  PLEX_CLAIM: ${PLEX_CLAIM}
  PLEX_PORT: ${PLEX_PORT}
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

########################### NETWORKS
networks:
  traefik_proxy:
    name: traefik_proxy
    external: true
  default:
    driver: bridge

########################### SERVICES
services:

############################# HOSTED WEBSITES

# Blog TROKA Software about software, smart home, etc
  blog-troka-software:
    image: 'nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46'
    restart: unless-stopped
    volumes:
      - ${HOMESERVERDIR}/blog.troka.software:/usr/share/nginx/html:ro
    ports:
      - '${BLOG_TROKA_SOFTWARE_PORT}:80'
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.backend=blog-troka-software"
      - "traefik.frontend.rule=Host:${DOMAINNAME},blog.${DOMAINNAME}"
#      - "traefik.frontend.rule=Host:${DOMAINNAME}; PathPrefixStrip: /portainer"
      - "traefik.port=80"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
      - "traefik.frontend.headers.STSSeconds=315360000"
      - "traefik.frontend.headers.browserXSSFilter=true"
      - "traefik.frontend.headers.contentTypeNosniff=true"
      - "traefik.frontend.headers.forceSTSHeader=true"
      - "traefik.frontend.headers.SSLHost=${DOMAINNAME}"
      - "traefik.frontend.headers.STSIncludeSubdomains=true"
      - "traefik.frontend.headers.STSPreload=true"
#      - "traefik.frontend.headers.frameDeny: true" #customFrameOptionsValue overrides this
      - "traefik.frontend.headers.customFrameOptionsValue=SAMEORIGIN"

############################# FRONTENDS

# Traefik - Reverse Proxy
# Create traefik.toml and rules dir and acme dir before running container.
  traefik:
    image: traefik:v1.7.24
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    domainname: ${DOMAINNAME}
    networks:
      - default
      - traefik_proxy
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_PORT}:8080"
    dns:
      - ${SERVER_IP}
      - ${ROUTER_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOMESERVERDIR}/traefik/traefik.toml:/etc/traefik/traefik.toml
      - ${HOMESERVERDIR}/traefik/rules.toml:/etc/traefik/rules.toml
      - ${HOMESERVERDIR}/traefik/acme/acme.json:/etc/traefik/acme/acme.json
      - ${HOMESERVERDIR}/shared:/shared
    environment:
      - CF_API_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_API_KEY=${CLOUDFLARE_API_KEY}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.backend=traefik"
      - "traefik.frontend.rule=Host:traefik.${DOMAINNAME}"
#      - "traefik.frontend.rule=Host:${DOMAINNAME}; PathPrefixStrip: /traefik"
      - "traefik.port=8080"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
      - "traefik.frontend.headers.STSSeconds=315360000"
      - "traefik.frontend.headers.browserXSSFilter=true"
      - "traefik.frontend.headers.contentTypeNosniff=true"
      - "traefik.frontend.headers.forceSTSHeader=true"
      - "traefik.frontend.headers.SSLHost=traefik.${DOMAINNAME}"
      - "traefik.frontend.headers.STSIncludeSubdomains=true"
      - "traefik.frontend.headers.STSPreload=true"
#      - "traefik.frontend.headers.frameDeny: true" #customFrameOptionsValue overrides this
      - "traefik.frontend.auth.basic.users=${HTTP_USERNAME}:${HTTP_PASSWORD}"

# Portainer - Container Management
# Needs trailing / in the URL if using PathPrefixStrip
  portainer:
    image: portainer/portainer
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    networks:
      - traefik_proxy
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOMESERVERDIR}/portainer/data:/data
      - ${HOMESERVERDIR}/shared:/shared
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.backend=portainer"
      - "traefik.frontend.rule=Host:portainer.${DOMAINNAME}"
#      - "traefik.frontend.rule=Host:${DOMAINNAME}; PathPrefixStrip: /portainer"
      - "traefik.port=9000"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
      - "traefik.frontend.headers.STSSeconds=315360000"
      - "traefik.frontend.headers.browserXSSFilter=true"
      - "traefik.frontend.headers.contentTypeNosniff=true"
      - "traefik.frontend.headers.forceSTSHeader=true"
      - "traefik.frontend.headers.SSLHost=portainer.${DOMAINNAME}"
      - "traefik.frontend.headers.STSIncludeSubdomains=true"
      - "traefik.frontend.headers.STSPreload=true"
#      - "traefik.frontend.headers.frameDeny: true" #customFrameOptionsValue overrides this

# Organizer - Unified HTPC/Home Server Web Interface
  organizr:
    image: lsiocommunity/organizr
    container_name: organizr
    hostname: organizr
    restart: always
    networks:
      - traefik_proxy
    volumes:
      - ${HOMESERVERDIR}/organizr:/config
      - ${HOMESERVERDIR}/shared:/shared
    ports:
      - "${ORGANIZER_PORT}:80"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.backend=organizr"
      - "traefik.frontend.rule=Host:organizr.${DOMAINNAME}"  
#      - "traefik.frontend.rule=Host:${DOMAINNAME}; PathPrefixStrip: /organizr"
      - "traefik.port=80"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.frontend.headers.SSLRedirect=true"
      - "traefik.frontend.headers.STSSeconds=315360000"
      - "traefik.frontend.headers.browserXSSFilter=true"
      - "traefik.frontend.headers.contentTypeNosniff=true"
      - "traefik.frontend.headers.forceSTSHeader=true"
      - "traefik.frontend.headers.SSLHost=organizr.${DOMAINNAME}"
      - "traefik.frontend.headers.STSIncludeSubdomains=true"
      - "traefik.frontend.headers.STSPreload=true"
#      - "traefik.frontend.headers.frameDeny: true" #customFrameOptionsValue overrides this


############################# SMART HOME
  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    restart: unless-stopped
    network_mode: host

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_94A990D185AC-if00:/dev/ttyZBT2
      - /dev/net/tun:/dev/net/tun

    volumes:
      - /var/lib/otbr:/data

    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyZBT2?uart-baudrate=460800&uart-flow-control"
      OT_INFRA_IF: "enp13s0"
      OT_THREAD_IF: "wpan0"
      OT_LOG_LEVEL: "5"

      # Home Assistant REST API
      OT_REST_LISTEN_ADDR: "127.0.0.1"
      OT_REST_LISTEN_PORT: "8081"

      # Optional OTBR web interface—moved away from UniFi
      OT_WEB_LISTEN_ADDR: "127.0.0.1"
      OT_WEB_LISTEN_PORT: "8082"

  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host

    volumes:
      - ./matter-data:/data

    environment:
      TZ: "Europe/Warsaw"
      PRIMARY_INTERFACE: "enp13s0"
      LISTEN_ADDRESS: "127.0.0.1"


