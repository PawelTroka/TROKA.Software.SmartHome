  zwavejs2mqtt:
    container_name: zwavejs2mqtt
    # Pinned to the verified live Z-Wave JS UI 11.22.3 image.
    image: zwavejs/zwavejs2mqtt@sha256:72f88913e22d862183142b70327494bc7f6ae79fe9538383addbad9d933384c9
    restart: always
    tty: true
    stop_signal: SIGINT
    environment:
      - SESSION_SECRET=${ZWAVEJS_SESSION_SECRET:?required}
      - ZWAVEJS_EXTERNAL_CONFIG=/usr/src/app/store/.config-db
      # Uncomment if you want logs time and dates to match your timezone instead of UTC
      # Available at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - traefik_proxy
    devices:
      # Do not use /dev/ttyUSBX serial devices, as those mappings can change over time.
      # Instead, use the /dev/serial/by-id/X serial device for your Z-Wave stick.
      - '/dev/serial/by-id/usb-0658_0200-if00:/dev/zwave'
    volumes:
      - $HOMESERVERDIR/zwave:/usr/src/app/store
    ports:
      - '${SERVER_IP}:8091:8091' # Z-Wave JS UI, LAN only
      - '127.0.0.1:3123:3000' # Home Assistant uses this local websocket


  shinobi:
    image: registry.gitlab.com/shinobi-systems/shinobi:dev@sha256:800ea1a9d48b07a6439d3fb6f552e9087dd31113ce056ca10f82d6ef9445e003
    restart: unless-stopped
